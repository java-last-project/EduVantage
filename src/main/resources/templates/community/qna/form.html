<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
	<div class="app-wrapper">
	
	    <th:block th:replace="~{community/sidebar::sidebar('qna')}"></th:block>
	
	    <main class="main-content py-5 px-4">
	        <div style="max-width: 900px; margin: 0 auto;">
	            
	            <div class="d-flex justify-content-between align-items-center mb-4">
	                <h2 class="fw-bold mb-0" style="font-size: 26px; color: #1e293b;"
	                    th:text="${vo.no==null?'고객센터 문의 등록':'고객센터 문의 수정'}"></h2>
	                <div>
	                    <a href="/qna/list" class="btn btn-outline-secondary fw-bold px-4 py-2 rounded-3">
	                        <i class="fa-solid fa-list me-1"></i> 목록으로
	                    </a>
	                </div>
	            </div>

	            <div class="bg-white rounded-3 shadow-sm border p-4">
	                <form th:action="${vo.no==null?'/qna/insert_ok':'/qna/update_ok'}" method="post">
	                    
	                    <input type="hidden" name="no" th:value="${vo.no}" th:if="${vo.no!=null}">
	                    <input type="hidden" name="member_id" th:value="${session.member_id}">

	                    <div class="mb-3">
	                        <label class="form-label fw-bold text-secondary small">문의 분류</label>
	                        <select class="form-select" name="categoryNo" required>
	                            <option value="" disabled th:selected="${vo.categoryNo==null}">분류를 선택해주세요</option>
	                            <option value="1" th:selected="${vo.categoryNo==1}">계정/인증</option>
	                            <option value="2" th:selected="${vo.categoryNo==2}">결제/환불</option>
	                            <option value="3" th:selected="${vo.categoryNo==3}">사이트 이용장애</option>
	                            <option value="5" th:selected="${vo.categoryNo==5}">쿠폰/이벤트</option>
	                            <option value="10" th:selected="${vo.categoryNo==10}">기타 문의</option>
	                        </select>
	                    </div>

	                    <div class="mb-3">
	                        <label class="form-label fw-bold text-secondary small">제목</label>
	                        <input type="text" class="form-control" name="subject" th:value="${vo.subject}" placeholder="제목을 입력하세요 (예: 결제 오류 문의드립니다)" required>
	                    </div>

	                    <div class="mb-4">
	                        <label class="form-label fw-bold text-secondary small">문의 내용</label>
	                        <textarea class="form-control" name="content" rows="10" placeholder="상세한 문의 내용을 입력해주세요..." required th:text="${vo.content}"></textarea>
	                    </div>

	                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
	                        <a href="/qna/list" class="btn btn-light px-4 fw-bold">취소</a>
	                        <button type="submit" class="btn btn-dark px-4 fw-bold" 
	                                th:text="${vo.no==null?'등록하기':'수정하기'}">전송</button>
	                    </div>

	                </form>
	            </div>

	        </div>
	    </main>
	</div>
</html>
