<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<script th:inline="javascript">
    const serverMsg=/*[[${msg}]]*/ null
	const noticeNo=/*[[${vo.no}]]*/ 0
	const SESSION_ID=/*[[${session.member_id}]]*/ ''
	const ROLE=/*[[${session.role}]]*/ 'ROLE_USER'
    if (serverMsg) {
        alert(serverMsg)
    }
</script>
	<div class="app-wrapper">
	
	    <th:block th:replace="~{community/sidebar::sidebar('notice')}"></th:block>
	
	    <main class="main-content py-5 px-4">
	        <div style="max-width: 1000px; margin: 0 auto;">
	            
	            <div class="d-flex justify-content-between align-items-center mb-4">
	                <h2 class="fw-bold mb-0" style="font-size: 26px; color: #1e293b;">공지 상세</h2>
	                <div>
	                    <a href="/notice/list" class="btn btn-outline-secondary fw-bold px-4 py-2 rounded-3">
	                        <i class="fa-solid fa-list me-1"></i> 목록
	                    </a>
	                </div>
	            </div>
	
	            <div class="bg-white rounded-3 border mb-4">
	                <div class="p-4 border-bottom">
	                    <div class="d-flex align-items-center gap-2 mb-2">
							<th:block th:switch="${vo.categoryNo}">
								<span th:case="1" class="status-badge badge-normal">일반공지</span>
								<span th:case="2" class="status-badge badge-info">학사/일정</span>
								<span th:case="3" class="status-badge badge-warning">시스템/점검</span>
								<span th:case="4" class="status-badge badge-success">이벤트/혜택</span>
								<span th:case="*" class="status-badge badge-normal">기타</span>
							</th:block>
	                    </div>
	                    <h3 class="fw-bold mb-3" style="font-size: 22px;">[[${vo.subject}]]</h3>
	                    <div class="d-flex justify-content-between text-muted small">
	                        <div>
	                            <i class="fa-regular fa-user me-1"></i>[관리자]
	                        </div>
	                        <div>
	                            <i class="fa-regular fa-clock me-1"></i> [[${#temporals.format(vo.regdate,'yyyy-MM-dd HH:mm:ss')}]]
	                        </div>
	                    </div>
	                </div>
	                <div class="p-4" style="min-height: 200px; white-space: pre-wrap; line-height: 1.6;" th:utext="${vo.content}"></div>
	                
	                <div class="p-3 border-top text-end bg-light" th:if="${session.member_id==vo.memberId && session.role=='ROLE_ADMIN'}">
	                    <a class="btn btn-sm btn-outline-primary me-2" th:href="@{/notice/update(no=${vo.no})}">수정</a>
	                    <a class="btn btn-sm btn-outline-danger" th:href="@{/notice/delete(no=${vo.no})}">삭제</a>
	                </div>
	            </div>
	
	        </div>
	    </main>
	</div>
</html>
