<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<main class="container py-5" style="max-width: 800px;">

    <div class="bg-white rounded-4 border shadow-sm p-4 p-md-5">
        <h2 class="fw-bold mb-4" style="color: #1e293b;" th:text="${vo==null?'자유게시판 글쓰기':'자유게시판 수정'}">글쓰기/수정</h2>

        <form th:action="${vo==null?'/freeboard/insert_ok':'/freeboard/update_ok'}" method="post">

            <input type="hidden" name="no" th:if="${vo!=null}" th:value="${vo.no}">
            <input type="hidden" name="member_id" th:if="${session.member_id!=null}" th:value="${session.member_id}">

            <div class="row mb-3" th:if="${session.member_id==null}">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label class="form-label fw-medium text-muted small">작성자</label>
                    <input type="text" name="name" class="form-control shadow-none" placeholder="이름을 입력하세요" th:value="${vo!=null?vo.name:''}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-medium text-muted small">비밀번호</label>
                    <input type="password" name="pwd" class="form-control shadow-none" placeholder="비밀번호를 입력하세요" th:required="${vo==null}">
                    <small class="text-muted" th:if="${vo != null}">* 수정 시 비밀번호는 입력하지 않아도 유지됩니다.</small>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-medium text-muted small">제목</label>
                <input type="text" name="subject" class="form-control shadow-none" placeholder="제목을 입력하세요" th:value="${vo!=null?vo.subject:''}" required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-medium text-muted small">내용</label>
                <textarea name="content" class="form-control shadow-none" rows="10" placeholder="내용을 입력하세요" style="resize: none;" th:text="${vo!=null?vo.content:''}" required></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center border-top pt-4">
                <a th:href="${vo==null?'/freeboard/list':'/freeboard/detail?no='+vo.no}" class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-medium">취소</a>
                <button type="submit" class="btn text-white px-4 py-2 rounded-3 fw-bold" style="background-color: #212529;" th:text="${vo==null?'등록하기':'수정하기'}">전송</button>
            </div>

        </form>
    </div>

</main>
</html>
