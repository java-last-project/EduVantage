<!DOCTYPE html>
<html>

<div class="layout">
<main class="main">

	<a href="javascript:history.back()" class="back-link"><i class="fa-solid fa-arrow-left"></i> 강의 관리로</a>

	<div class="page-header">
		<div>
			<h1 class="page-title">새소식</h1>
			<p class="page-desc">이 강의를 듣는 수강생에게 보이는 공지와 자료를 관리합니다.</p>
		</div>
		<a th:href="@{/instructor/news_insert(courseId=${courseId})}" class="btn btn-primary">
	        <i class="fa-solid fa-plus"></i>
	        새소식 등록
	    </a>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>제목</th>
					<th>첨부파일</th>
					<th>조회수</th>
					<th>등록일</th>
				</tr>
			</thead>
			<tbody>

				<!-- 반복 -->
				<tr th:each="vo : ${list}">
                <td>[[${vo.NO}]]</td>
                <td class="qna-title-text"><a class="plain-link" th:href="@{/instructor/news_detail(no=${vo.NO})}">[[${vo.SUBJECT}]]</a></td>
                <td class="date-text">[[${vo.FILENAME != null ? vo.FILENAME : '-'}]]</td>
                <td class="views-text">[[${vo.HIT}]]</td>
                <td class="date-text">[[${vo.REGDATE}]]</td>
            </tr>

			</tbody>
		</table>
	</div>

</main>
</div>

</html>
