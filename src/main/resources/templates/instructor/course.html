<!DOCTYPE html>
<html>

<style>


@media (max-width:900px){
	.main{ padding:20px; }
}
</style>

<div class="layout">
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">담당 강의 목록</h1>
			<p class="page-desc">내가 개설한 강의를 관리하고 새 강의를 등록합니다.</p>
		</div>
		<a class="btn btn-primary" th:href="@{/instructor/new_course}">
			<i class="fa-solid fa-plus"></i>
			새 강의 등록
		</a>
	</div>

	<div id="course-list">

		<div class="card-horizontal" th:each="vo:${list}">
			<div class="img-placeholder">
				<!-- <i class="fa-regular fa-image fa-2x"></i> -->
				<a th:href="@{/course/detail(no=${vo.NO})}" class="plain-link"><img th:src="${vo.THUMBNAIL}"></a>
			</div>
			<div class="card-content">
				<a th:href="@{/course/detail(no=${vo.NO})}" class="plain-link"><h5>[[${vo.TITLE}]]</h5></a>
				<p>
					<i class="fa-solid fa-star" style="color:#f59e0b;"></i> [[${vo.STAR}]]
					&nbsp;&nbsp;
					<i class="fa-solid fa-user"></i> 수강생 [[${vo.STUDENT_COUNT}]]명
				</p>
				<div class="card-actions">
					<a class="btn btn-sm-outline" th:href="@{/instructor/course_detail(course_no=${vo.NO})}">관리</a>
					<button class="btn-sm-danger">삭제</button>
				</div>
			</div>
		</div>


	</div>

</main>
</div>

</html>
