<!DOCTYPE html>
<html>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript"
	src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script type="text/javascript">
$(function(){
	
	$('#postBtn').on('click',function(){
		new daum.Postcode({
			oncomplete(data)
			{
				$('#post').val(data.zonecode)
				$('#addr1').val(data.address)
				$('#addr2').val('')
			}
		}).open()
	})
	
})
</script>
<script th:if="${error != null}" th:inline="javascript">
	alert(/*[[${error}]]*/)
</script>

<div class="layout">
	<main class="main">

		<a href="/instructor/profile" class="back-link"><i
			class="fa-solid fa-arrow-left"></i> 프로필로</a>

		<div class="page-header">
			<h1 class="page-title">프로필 수정</h1>
		</div>


		<form th:action="@{/instructor/profile_edit_ok}" method="post" onsubmit="return confirm('저장하시겠습니까?')">
			<div class="section-card">
				<div class="section-card-header">기본 정보</div>
				<div class="section-card-body">

					<div class="form-row">
						<label>아이디</label>
						<div class="readonly-text" name="username">[[${vo.username}]]</div>
					</div>

					<div class="form-row">
						<label>비밀번호</label> <input type="password" class="form-input"
							placeholder="변경 시에만 입력하세요" name="password">
					</div>

					<div class="form-row">
						<label>비밀번호 확인</label> <input type="password" class="form-input"
							placeholder="변경 시에만 입력하세요" name="password_confirm">
					</div>

					<div class="form-row">
						<label>이름</label> <input type="text" class="form-input"
							th:value="${vo.name}" name="name" required>
					</div>

					<div class="form-row">
						<label>성별</label>
						<div class="sex-options">
							<label><input type="radio" name="sex" value='M'
								th:checked="${vo.sex == 'M'}"> 남</label> <label><input
								type="radio" name="sex" value='F' th:checked="${vo.sex == 'F'}">
								여</label>
						</div>
					</div>

					<div class="form-row">
						<label>생년월일</label> <input type="date" class="form-input"
							th:value="${vo.birthdate}" name="birthdate" required>
					</div>

					<div class="form-row">
						<label>연락처</label> <input type="text" class="form-input"
							th:value="${vo.phone}" name="phone" required>
					</div>

					<div class="form-row">
						<label>이메일</label> <input type="text" class="form-input"
							th:value="${vo.email}" name="email">
					</div>

					<div class="form-row">
						<label>주소</label>
						<div class="addr-row" style="margin-bottom: 8px;">
							<input type="text" class="form-input" style="max-width: 140px;"
								id="post" name="post" th:value="${vo.post}" placeholder="우편번호" required>
							<button class="btn-outline" id="postBtn" type="button">우편번호
								검색</button>
						</div>
						<input type="text" class="form-input" style="margin-bottom: 8px;"
							id="addr1" name="addr1" th:value="${vo.addr1}" required> <input type="text"
							class="form-input" id="addr2" name="addr2" th:value="${vo.addr2}"
							placeholder="상세주소">
					</div>

				</div>

			</div>

			<div class="section-card">
				<div class="section-card-header">자기소개</div>
				<div class="section-card-body">
					<textarea class="form-textarea" style="min-height: 140px;" name="profile_desc">[[${vo.profile_desc}]]</textarea>
				</div>
			</div>

			<div class="form-actions">
				<a class="btn btn-outline" href="/instructor/profile">취소</a>
				<button class="btn-primary" type="submit">저장</button>
			</div>
		</form>

	</main>
</div>

</html>
