<!DOCTYPE html>
<html>
<meta charset="UTF-8">

<link rel="stylesheet" href="/css/instructor/instructor.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<div class="layout">
		<aside class="exam-sidebar">
		<nav class="exam-nav">
			<a href="/instructor/profile" class="exam-nav-item" th:classappend="${instructor_html == 'instructor/profile'} ? 'active':''"><i class="fa-solid fa-user"></i> 프로필</a>
			<a href="/instructor/course" class="exam-nav-item" th:classappend="${instructor_html == 'instructor/course' || instructor_html == 'instructor/course_detail' || instructor_html == 'instructor/new_course'} ? 'active':''"><i class="fa-solid fa-book-open"></i> 담당 강의 목록</a>
			<a href="/instructor/qna" class="exam-nav-item" th:classappend="${instructor_html == 'instructor/qna' || instructor_html == 'instructor/qna_detail'} ? 'active':''"><i class="fa-solid fa-comment"></i> 수강생 QnA</a>
			<a href="/instructor/exam/scheduled" class="exam-nav-item" th:classappend="${instructor_html=='instructor/exam/scheduled'}?'active':''"><i class="fa-solid fa-calendar-check"></i>정기시험 관리</a>
			<a href="/instructor/exam/grading" class="exam-nav-item" th:classappend="${instructor_html=='instructor/exam/grading'}?'active':''"><i class="fa-solid fa-pen-to-square"></i>주관식 채점</a>
		</nav>

	</aside>
		
		<!-- 메인 화면 -->
		<!-- 본문 내용 삽입 영역 -->
    	<th:block th:include="${instructor_html}"></th:block>
	</div>
</html>
