<!DOCTYPE html>
<html>

<style>
	.page-header{ 
        display: block;
        margin-bottom:24px; 
    }
    .page-title{
        font-size:26px;
        font-weight:700;
        margin:0 0 6px;
        color:var(--text-main);
    }
    .page-desc{
        font-size:14px;
        color:var(--text-muted);
        margin:0;
    }

	.table-card tbody td{
		padding:16px 20px;
		font-size:14px;
		border-bottom:1px solid var(--border-color);
		vertical-align:middle;
	}

	@media (max-width:900px){
		.main{ padding:20px; }
	}
</style>

<div class="layout">
<main class="main">

	<div class="page-header">
		<h1 class="page-title">수강생 QnA</h1>
		<p class="page-desc">내 강의에 달린 질문을 확인하고 답변 상태를 관리합니다.</p>
	</div>
	
	<div class="filters">
	<form th:action="@{/instructor/qna}" method="get" style="display: contents;">
	<div class="select-box">
	강의: 
		<select class="native-select" name="title" onchange="this.form.submit()">
			<option value="all" th:selected="${title==null or title=='all'}">전체</option>
			<option th:each="c:${filterList}" th:value="${c}" th:selected="${title==c}">[[${c}]]</option>
		</select>
		<i class="fa-solid fa-chevron-down"></i>
	</div>
	<div class="select-box">
	답변상태:  
		<select class="native-select" name="status" onchange="this.form.submit()">
			<option value="all" th:selected="${status==null or status=='all'}">전체 상태</option>
			<option value="Y" th:selected="${status=='Y'}">답변완료</option>
			<option value="N" th:selected="${status=='N'}">답변대기</option>
		</select>
		<i class="fa-solid fa-chevron-down"></i>
	</div>
		</form>

	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>제목</th>
					<th>강의</th>
					<th>작성자</th>
					<th>답변상태</th>
					<th>등록일</th>
				</tr>
			</thead>
			<tbody>
				
				<!-- 반복 -->
				<tr th:each="vo:${list}">
					<td>[[${vo.NO}]]</td>
					<td><a th:href="@{/instructor/qna_detail(no=${vo.NO})}" class="qna-title-text">[[${vo.SUBJECT}]]</a></td>
					<td><span class="course-tag">[[${vo.TITLE}]]</span></td>
					<td class="author-text">[[${vo.NAME}]]</td>
					<td><span class="badge" th:classappend="${vo.STATUS=='Y'?'badge-active':'badge-pending'}">[[${vo.STATUS=='Y'?'답변완료':'답변대기'}]]</span></td>
					<td class="date-text">[[${vo.REGDATE}]]</td>
				</tr>
				
			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>[[${count}]]</b>개 중 <b>[[${startNum}]]-[[${endNum}]]</b> 표시</div>
			
			<div class="page-controls">
				<a th:if="${startPage > 1}" class="btn page-btn nav" th:href="@{/instructor/qna(page=${startPage-1},title=${title},status=${status})}"><i class="fa-solid fa-chevron-left"></i></a>
				<a th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i}?'btn page-btn active':'btn page-btn'" th:href="@{/instructor/qna(page=${i},title=${title},status=${status})}">[[${i}]]</a>
				<a th:if="${endPage < totalpage}" class="btn page-btn nav" th:href="@{/instructor/qna(page=${endPage+1},title=${title},status=${status})}"><i class="fa-solid fa-chevron-right"></i></a>
			</div>
		</div>
	</div>

</main>
</div>

</html>
