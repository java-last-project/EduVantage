<!DOCTYPE html>
<html>

<div class="layout">
<main class="main">

	<div class="profile-header">
		<div class="profile-avatar">김</div>
		<div class="profile-info">
			<div class="profile-name-row">
				<h1 class="profile-name">[[${vo.name}]]</h1>
				<span class="role-tag">강의 제공자</span>
			</div>
			<div class="profile-meta">[[${vo.username}]] &middot; 가입일 [[${vo.dbday}]]</div>
		</div>
		<button class="btn-outline">프로필 수정</button>
	</div>

	<div class="bio-card">
		<h2>강사 소개</h2>
		<p class="bio-text">
			[[${vo.profile_desc}]]
		</p>
	</div>

</main>
</div>

</html>
