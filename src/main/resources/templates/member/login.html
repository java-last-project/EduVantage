<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<style>
.login-wrapper {
	background-color: #f7f8fa;
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: calc(100vh - 200px);
	padding: 50px 0;
	font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI",
		Roboto, sans-serif;
}

/* 로그인 폼 카드 컨테이너 */
.login-container {
	background: #ffffff;
	width: 400px;
	padding: 50px 40px;
	border-radius: 12px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
	box-sizing: border-box;
}

/* 상단 뱃지 및 타이틀 */
.header-area {
	text-align: center;
	margin-bottom: 35px;
}

.system-badge {
	display: inline-block;
	background-color: #f0f0ff;
	color: #5a5cff;
	padding: 4px 10px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 700;
	margin-bottom: 10px;
}

.login-title {
	font-size: 26px;
	font-weight: 800;
	color: #222;
	margin: 0;
}

/* 입력 그룹 */
.input-group {
	margin-bottom: 20px;
}

.input-group label {
	display: block;
	font-size: 13px;
	font-weight: 700;
	color: #444;
	margin-bottom: 8px;
}

.input-group input[type="text"], .input-group input[type="password"] {
	width: 100%;
	padding: 14px 16px;
	border: 1px solid #e0e0e0;
	border-radius: 8px;
	font-size: 14px;
	box-sizing: border-box;
	outline: none;
	transition: border-color 0.2s;
}

.input-group input::placeholder {
	color: #bbb;
}

.input-group input:focus {
	border-color: #5a5cff;
}

.checkbox-group {
	display: flex;
	align-items: center;
	margin-bottom: 30px;
}

.checkbox-group input[type="checkbox"] {
	width: 16px;
	height: 16px;
	margin-right: 8px;
	accent-color: #5a5cff;
	cursor: pointer;
}

.checkbox-group label {
	font-size: 13px;
	color: #666;
	cursor: pointer;
}

.btn-group {
	display: flex;
	gap: 10px;
	margin-bottom: 25px;
}

.btn {
	flex: 1;
	padding: 15px 0;
	border-radius: 8px;
	font-size: 15px;
	font-weight: 700;
	text-align: center;
	cursor: pointer;
	border: none;
	transition: background-color 0.2s;
}

.btn-cancel {
	background-color: #fff;
	border: 1px solid #ddd;
	color: #555;
}

.btn-cancel:hover {
	background-color: #f9f9f9;
}

.btn-login {
	background-color: #5a5cff;
	color: #fff;
}

.btn-login:hover {
	background-color: #484ae6;
}

.footer-links {
	text-align: center;
	font-size: 13px;
	color: #888;
}

.footer-links a {
	color: #5a5cff;
	text-decoration: none;
	font-weight: 700;
	margin-left: 5px;
}

.error-message {
	color: #ff4d4f;
	font-size: 13px;
	text-align: center;
	margin-top: 15px;
	font-weight: 600;
}
</style>
</head>
<body>
	<div class="login-wrapper">
		<div class="login-container">
			<div class="header-area">
				<div class="system-badge">교육센터 평가 시스템</div>
				<h3 class="login-title">로그인</h3>
			</div>

			<form action="/member/login_process" method="post">
				<div class="input-group">
					<label for="userid">아이디</label> <input type="text" id="userid"
						name="userid" placeholder="아이디를 입력해 주세요">
				</div>

				<div class="input-group">
					<label for="userpwd">비밀번호</label> <input type="password"
						id="userpwd" name="userpwd" placeholder="비밀번호를 입력해 주세요">
				</div>

				<div class="checkbox-group">
					<input type="checkbox" id="remember-me" name="remember-me">
					<label for="remember-me">자동 로그인</label>
				</div>

				<div class="btn-group">
					<button type="button" class="btn btn-cancel"
						onclick="javascript:history.back()">취소</button>
					<button type="submit" class="btn btn-login">로그인</button>
				</div>

				<div class="footer-links">
					아직 계정이 없으신가요? <a href="/member/join">회원가입</a>
				</div>

				<div class="error-message">[[${message}]]</div>
			</form>
		</div>
	</div>
</body>
</html>
