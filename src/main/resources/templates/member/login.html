<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<link rel="stylesheet" href="/css/member/login.css">
</head>
<body>
	<div class="login-wrapper">
		<div class="login-container">
			<div class="header-area">
				<div class="system-badge">교육센터 평가 시스템</div>
				<h3 class="login-title">로그인</h3>
			</div>

			<form action="/member/login_process" method="post">
				<div class="input-group">
					<label for="userid">아이디</label> <input type="text" id="userid"
						name="userid" placeholder="아이디를 입력해 주세요">
				</div>

				<div class="input-group">
					<label for="userpwd">비밀번호</label> <input type="password"
						id="userpwd" name="userpwd" placeholder="비밀번호를 입력해 주세요">
				</div>
				

				<div class="checkbox-group">
					<input type="checkbox" id="remember-me" name="remember-me">
					<label for="remember-me">자동 로그인</label>
				</div>

				<div class="btn-group">
					<button type="button" class="btn btn-cancel"
						onclick="javascript:history.back()">취소</button>
					<button type="submit" class="btn btn-login">로그인</button>
				</div>
				
				<!-- 소셜 로그인 -->
				<div class="social-login-divider">
			        <span>또는</span>
			    </div>
			    
			    <a href="/oauth2/authorization/google" class="btn-google-login">
			        <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right: 8px;">
			            <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.97c1.74-1.6 2.66-3.95 2.66-6.62z"/>
			            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.97-2.26c-.81.54-1.85.9-2.99.9-2.3 0-4.25-1.55-4.95-3.64H1.02v2.33C2.55 15.96 5.51 18 9 18z"/>
			            <path fill="#FBBC05" d="M4.05 10.82c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V5.05H1.02C.37 6.35 0 7.82 0 9.4s.37 3.05 1.02 4.35l3.03-2.33z"/>
			            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.51 0 2.55 2.04 1.02 5.05l3.03 2.33c.7-2.09 2.65-3.64 4.95-3.64z"/>
			        </svg>
			        구글로 시작하기
			    </a>
				<br>

				<br>
				<div class="footer-links">
					아직 계정이 없으신가요? <a href="/member/join">회원가입</a>
				</div>

				<div class="error-message">[[${message}]]</div>
			</form>
		</div>
	</div>
</body>
</html>
