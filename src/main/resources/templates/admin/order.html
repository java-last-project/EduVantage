<!DOCTYPE html>
<html>

<div class="layout">
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">결제/주문 관리</h1>
			<p class="page-desc">결제 및 주문 내역을 조회합니다.</p>
		</div>
	</div>

	<div class="filters">
		<!-- <div class="select-box">
			상태: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div> -->
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>회원</th>
					<th>강의</th>
					<th>결제금액</th>
					<th>상태</th>
					<th>결제일</th>
				</tr>
			</thead>
			<tbody>

				<!-- 반복 -->
				<tr th:each="vo:${list}">
					<td>[[${vo.NO}]]</td>
					<td>[[${vo.NAME}]]</td>
					<td>[[${vo.TITLE}]]</td>
					<td>[[${vo.PRICE}]]원</td>
					<td>
						<span th:if="${vo.ORDER_STATUS == '결제완료'}" class="badge badge-active">결제완료</span>
						<span th:if="${vo.ORDER_STATUS == '취소'}" class="badge badge-suspended">취소</span>
						<span th:if="${vo.ORDER_STATUS == '환불'}" class="badge badge-pending">환불</span>
					</td>
					<td>[[${vo.REGDATE}]]</td>
				</tr>

			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>[[${count}]]</b>건 중 <b>[[${startNum}]]-[[${endNum}]]</b> 표시</div>
			
			<div class="page-controls" th:if="${count>10}">
				<button th:if="${startPage > 1}" class="page-btn nav"><a th:href="@{/admin/order(page=${startPage-1})}"><i class="fa-solid fa-chevron-left"></i></a></button>
				<button th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i}?'page-btn active':'page-btn'"><a th:href="@{/admin/order(page=${i})}">[[${i}]]</a></button>
				<button th:if="${endPage < totalpage}" class="page-btn nav"><a th:href="@{/admin/order(page=${endPage+1})}"><i class="fa-solid fa-chevron-right"></i></a></button>
			</div>
		</div>
	</div>

</main>
</div>

</html>
