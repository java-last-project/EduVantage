<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<style>
	:root{
		--green-bg:#dcfce7; --green-text:#16a34a;
		--red-bg:#fee2e2;   --red-text:#dc2626;
		--yellow-bg:#fef9c3; --yellow-text:#a16207;
		--radius:10px;
	}

	.layout{
		display:flex;
		flex:1;
		background:#f5f6f8;
	}

	.main{
		flex:1;
		min-width:0;
		padding:32px 40px;
	}

	/* ===== 헤더 영역 ===== */
	.page-header{
		display:flex;
		justify-content:space-between;
		align-items:flex-start;
		margin-bottom:24px;
		flex-wrap:wrap;
		gap:12px;
	}
	.page-title{
		font-size:26px;
		font-weight:700;
		margin:0 0 6px;
		color:var(--text-main);
	}
	.page-desc{
		font-size:14px;
		color:var(--text-muted);
		margin:0;
	}
	.btn-export{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:var(--text-main);
		cursor:pointer;
		white-space:nowrap;
	}
	.btn-export:hover{ background:#f9fafb; }

	/* ===== 필터 영역 ===== */
	.filters{
		display:flex;
		gap:12px;
		margin-bottom:16px;
		flex-wrap:wrap;
	}
	.select-box, .search-box{
		display:flex;
		align-items:center;
		gap:8px;
		padding:10px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		color:var(--text-main);
	}
	.select-box{ cursor:pointer; white-space:nowrap; }
	.select-box .muted{ color:var(--text-muted); }
	.select-box i, .search-box i{
		font-size:12px;
		color:var(--text-muted);
		flex-shrink:0;
	}
	.search-box{ flex:1; min-width:200px; }
	.search-box input{
		border:none;
		outline:none;
		font-size:14px;
		flex:1;
		background:transparent;
		color:var(--text-main);
	}
	.search-box input::placeholder{ color:#9ca3af; }

	/* ===== 테이블 ===== */
	.table-card{
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:var(--radius);
		overflow:hidden;
	}
	.table-card table{ width:100%; border-collapse:collapse; }
	.table-card thead th{
		text-align:left;
		font-size:13px;
		font-weight:600;
		color:var(--text-muted);
		padding:14px 20px;
		border-bottom:1px solid var(--border-color);
		background:#fafafa;
	}
	.table-card tbody td{
		padding:16px 20px;
		font-size:14px;
		border-bottom:1px solid var(--border-color);
		vertical-align:middle;
	}
	.table-card tbody tr:last-child td{ border-bottom:none; }
	.table-card tbody tr:hover{ background:#fafafa; }

	.order-no{ font-family:monospace; font-size:13px; color:var(--text-muted); }
	.buyer-name{ font-weight:500; color:var(--text-main); }
	.course-title-text{ color:var(--text-main); }
	.amount-text{ color:var(--text-main); font-weight:600; }
	.pay-method{ color:var(--text-muted); }

	.badge{
		display:inline-block;
		padding:4px 10px;
		border-radius:6px;
		font-size:12px;
		font-weight:600;
	}
	.badge-active{ background:var(--green-bg); color:var(--green-text); }
	.badge-suspended{ background:var(--red-bg); color:var(--red-text); }
	.badge-pending{ background:var(--yellow-bg); color:var(--yellow-text); }

	.btn-detail{
		padding:7px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.btn-detail:hover{ background:#f3f4f6; }

	/* ===== 페이지네이션 ===== */
	.pagination{
		display:flex;
		align-items:center;
		justify-content:space-between;
		padding:16px 20px;
		font-size:14px;
		color:var(--text-muted);
		flex-wrap:wrap;
		gap:12px;
	}
	.pagination b{ color:var(--text-main); }
	.page-controls{ display:flex; align-items:center; gap:4px; }
	.page-btn{
		width:32px; height:32px;
		display:flex;
		align-items:center;
		justify-content:center;
		border:1px solid var(--border-color);
		background:#fff;
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.page-btn:hover{ background:#f3f4f6; }
	.page-btn.active{
		background:var(--main-color);
		border-color:var(--main-color);
		color:#fff;
	}
	.page-btn.nav{ color:var(--text-muted); }

	@media (max-width:900px){
		.main{ padding:20px; }
	}
</style>

<div class="layout">
<!-- ================= Main ================= -->
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">결제/주문 관리</h1>
			<p class="page-desc">결제 및 주문 내역을 조회하고 환불/취소 상태를 관리합니다.</p>
		</div>
		<button class="btn-export">
			<i class="fa-solid fa-file-export"></i>
			CSV 내보내기
		</button>
	</div>

	<div class="filters">
		<div class="select-box">
			결제수단: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="select-box">
			상태: <span class="muted">전체 상태</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="search-box">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input type="text" placeholder="주문번호 또는 이름으로 검색...">
		</div>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>주문번호</th>
					<th>회원</th>
					<th>강의명</th>
					<th>결제금액</th>
					<th>결제수단</th>
					<th>상태</th>
					<th>결제일</th>
					<th style="text-align:right;">관리</th>
				</tr>
			</thead>
			<tbody id="order-table-body">
				<!-- rows injected by JS -->
			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>152</b>건 중 <b>1-7</b> 표시</div>
			<div class="page-controls">
				<button class="page-btn nav"><i class="fa-solid fa-chevron-left"></i></button>
				<button class="page-btn active">1</button>
				<button class="page-btn">2</button>
				<button class="page-btn">3</button>
				<button class="page-btn">4</button>
				<button class="page-btn nav"><i class="fa-solid fa-chevron-right"></i></button>
			</div>
		</div>
	</div>

</main>
</div>

<script>
	const orders = [
		{ no:1, orderNo:"ORD-20240315-001", buyer:"김민수", course:"스프링 부트로 배우는 백엔드 개발", amount:"88,000원", method:"카드",     status:"결제완료", date:"2024.03.15" },
		{ no:2, orderNo:"ORD-20240314-002", buyer:"박준형", course:"Vue3 + Pinia 실전 프론트엔드",       amount:"77,000원", method:"카카오페이", status:"결제완료", date:"2024.03.14" },
		{ no:3, orderNo:"ORD-20240312-003", buyer:"최수빈", course:"오라클 DB 기초부터 실무까지",         amount:"65,000원", method:"계좌이체",   status:"결제대기", date:"2024.03.12" },
		{ no:4, orderNo:"ORD-20240310-004", buyer:"한소희", course:"자바 알고리즘 트레이닝",              amount:"55,000원", method:"카드",       status:"환불완료", date:"2024.03.10" },
		{ no:5, orderNo:"ORD-20240309-005", buyer:"윤도현", course:"타입스크립트 실전 입문",              amount:"49,000원", method:"카드",       status:"결제완료", date:"2024.03.09" },
		{ no:6, orderNo:"ORD-20240307-006", buyer:"김민수", course:"MyBatis로 배우는 매퍼 설계",          amount:"69,000원", method:"카카오페이", status:"결제완료", date:"2024.03.07" },
		{ no:7, orderNo:"ORD-20240305-007", buyer:"박준형", course:"파이썬 데이터 분석 기초",              amount:"59,000원", method:"계좌이체",   status:"환불완료", date:"2024.03.05" },
	];

	const statusMap = {
		"결제완료": "badge-active",
		"환불완료": "badge-suspended",
		"결제대기": "badge-pending",
	};

	const tbody = document.getElementById("order-table-body");
	tbody.innerHTML = orders.map(o => `
		<tr>
			<td>${o.no}</td>
			<td class="order-no">${o.orderNo}</td>
			<td class="buyer-name">${o.buyer}</td>
			<td class="course-title-text">${o.course}</td>
			<td class="amount-text">${o.amount}</td>
			<td class="pay-method">${o.method}</td>
			<td><span class="badge ${statusMap[o.status]}">${o.status}</span></td>
			<td>${o.date}</td>
			<td style="text-align:right;">
				<button class="btn-detail">상세보기</button>
			</td>
		</tr>
	`).join("");
</script>

</html>
