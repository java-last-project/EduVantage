<!DOCTYPE html>
<html>

<div class="layout">
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">공지사항 관리</h1>
			<p class="page-desc">플랫폼 공지사항을 등록합니다.</p>
		</div>
		<a class="btn btn-primary" href="/admin/notice_insert">
			<i class="fa-solid fa-plus"></i>
			새 공지 등록
		</a>
	</div>

	<div class="filters">
		<form th:action="@{/admin/notice}" method="get" style="display: contents;">
			<div class="select-box">
			분류:  
				<select class="native-select" name="categoryNo" onchange="this.form.submit()">
					<option value="0" th:selected="${category_no==null or category_no==0}">전체</option>
					<option value="1" th:selected="${category_no==1}">일반공지</option>
					<option value="2" th:selected="${category_no==2}">학사/일정</option>
					<option value="3" th:selected="${category_no==3}">시스템/점검</option>
					<option value="4" th:selected="${category_no==4}">이벤트/혜택</option>
				</select>
				<i class="fa-solid fa-chevron-down"></i>
			</div>
			<div class="search-box">
				<i class="fa-solid fa-magnifying-glass"></i>
				<input type="text" name="fd" th:value="${fd}" placeholder="제목/내용으로 검색...">
				<button type="submit" class="btn-light-custom"><i class="fa-solid fa-magnifying-glass"></i></button>
			</div>
		</form>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>제목</th>
					<th>작성자</th>
					<th>조회수</th>
					<th>분류</th>
					<th>등록일</th>
				</tr>
			</thead>
			<tbody id="notice-table-body">

				<!-- 반복 -->
				<tr th:each="vo:${list}">
					<td>[[${vo.no}]]</td>
					<td>
						<div class="notice-title-cell">
							<span class="notice-title-text"><a th:href="@{/notice/detail(no=${vo.no})}" class="plain-link">[[${vo.subject}]]</a></span>
						</div>
					</td>
					<td class="author-text">[관리자]</td>
					<td class="views-text">[[${vo.hit}]]</td>
					<td>
						<span class="cat-tag" th:classappend="${vo.category_no==1?'cat-general':''}" th:if="${vo.category_no==1}">일반공지</span>
						<span class="cat-tag" th:classappend="${vo.category_no==2?'cat-academic':''}" th:if="${vo.category_no==2}">학사/일정</span>
						<span class="cat-tag" th:classappend="${vo.category_no==3?'cat-system':''}" th:if="${vo.category_no==3}">시스템/점검</span>
						<span class="cat-tag" th:classappend="${vo.category_no==4?'cat-event':''}" th:if="${vo.category_no==4}">이벤트/혜택</span>
					</td>
					<td class="date-text">[[${vo.dbday}]]</td>
				</tr>

			</tbody>
		</table>

		<div class="pagination">
		
			<div>전체 <b>[[${count}]]</b>개 중 <b>[[${startNum}]]-[[${endNum}]]</b> 표시</div>
			
			<div class="page-controls" th:if="${count>10}">
				<button th:if="${startPage > 1}" class="page-btn nav"><a th:href="@{/admin/notice(page=${startPage-1}, fd=${fd}, categoryNo=${category_no})}"><i class="fa-solid fa-chevron-left"></i></a></button>
				<button th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i}?'page-btn active':'page-btn'"><a th:href="@{/admin/notice(page=${i}, fd=${fd}, categoryNo=${category_no})}">[[${i}]]</a></button>
				<button th:if="${endPage < totalpage}" class="page-btn nav"><a th:href="@{/admin/notice(page=${endPage+1}, fd=${fd}, categoryNo=${category_no})}"><i class="fa-solid fa-chevron-right"></i></a></button>
			</div>
		</div>
	</div>

</main>
</div>

</html>
