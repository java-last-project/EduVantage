<!DOCTYPE html>
<html>
<style>
	/* 강의 등록 - primary 버튼 (강의관리 전용) */
	.btn-primary{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:var(--main-color);
		border:1px solid var(--main-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:#ffffff;
		cursor:pointer;
		white-space:nowrap;
	}
</style>

<div class="layout">
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">강의관리</h1>
			<p class="page-desc">등록된 강의를 조회하고 관리합니다.</p>
		</div>
	</div>

	<div class="filters">
		<form th:action="@{/admin/course}" method="get">
			<div class="search-box">
				<i class="fa-solid fa-magnifying-glass"></i>
				<input type="text" name="title" th:value="${title}" placeholder="강의명으로 검색...">
				<button type="submit" class="btn-light-custom"><i class="fa-solid fa-magnifying-glass"></i></button>
			</div>
		</form>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>강의</th>
					<th>강사</th>
					<th>가격</th>
					<th style="text-align:right;">관리&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</th>
				</tr>
			</thead>
			<tbody id="course-table-body">
				
				<!-- 반복 -->
				<tr th:each="c:${list}">
					<td>[[${c.NO}]]</td>
					<td>
						<div class="course-name">
							<div class="course-thumb-sm img-placeholder"><img th:src="${c.THUMBNAIL}"></div>
							<div>
								<div class="course-title-text"><a th:href="@{/course/detail(no=${c.NO})}" class="plain-link">[[${c.TITLE}]]</a></div>
								
							</div>
						</div>
					</td>
					<td>[[${c.NAME}]]</td>
					<td class="price-text">[[${c.PAYPRICE}]]원</td>
					<td style="text-align:right;">
						<button class="btn-detail">강의삭제</button>
					</td>
				</tr>
				
			</tbody>
		</table>

		<div class="pagination">
		
			<div>전체 <b>[[${count}]]</b>개 중 <b>[[${startNum}]]-[[${endNum}]]</b> 표시</div>
			
			<div class="page-controls">
				<button th:if="${startPage > 1}" class="page-btn nav"><a th:href="@{/admin/course(page=${startPage-1},title=${title})}"><i class="fa-solid fa-chevron-left"></i></a></button>
				<button th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i}?'page-btn active':'page-btn'"><a th:href="@{/admin/course(page=${i},title=${title})}">[[${i}]]</a></button>
				<button th:if="${endPage < totalpage}" class="page-btn nav"><a th:href="@{/admin/course(page=${endPage+1},title=${title})}"><i class="fa-solid fa-chevron-right"></i></a></button>
			</div>
		</div>

	</div>

</main>
</div>


</html>
