<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<style>
	:root{
		--green-bg:#dcfce7; --green-text:#16a34a;
		--red-bg:#fee2e2;   --red-text:#dc2626;
		--yellow-bg:#fef9c3; --yellow-text:#a16207;
		--radius:10px;
	}
	
	.layout{
		display:flex;
		flex:1;
		background:#f5f6f8;
	}
	
	.main{
		flex:1;
		min-width:0;
		padding:32px 40px;
	}

	/* ===== 헤더 영역 ===== */
	.page-header{
		display:flex;
		justify-content:space-between;
		align-items:flex-start;
		margin-bottom:24px;
		flex-wrap:wrap;
		gap:12px;
	}
	.page-title{
		font-size:26px;
		font-weight:700;
		margin:0 0 6px;
		color:var(--text-main);
	}
	.page-desc{
		font-size:14px;
		color:var(--text-muted);
		margin:0;
	}
	.btn-export{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:var(--text-main);
		cursor:pointer;
		white-space:nowrap;
	}
	.btn-export:hover{ background:#f9fafb; }

	/* 강의 등록 - primary 버튼 (강의관리 전용) */
	.btn-primary{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:var(--main-color);
		border:1px solid var(--main-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:#ffffff;
		cursor:pointer;
		white-space:nowrap;
	}
	.btn-primary:hover{ background:var(--main-hover); border-color:var(--main-hover); }

	/* ===== 필터 영역 ===== */
	.filters{
		display:flex;
		gap:12px;
		margin-bottom:16px;
		flex-wrap:wrap;
	}
	.select-box, .search-box{
		display:flex;
		align-items:center;
		gap:8px;
		padding:10px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		color:var(--text-main);
	}
	.select-box{ cursor:pointer; white-space:nowrap; }
	.select-box .muted{ color:var(--text-muted); }
	.select-box i, .search-box i{
		font-size:12px;
		color:var(--text-muted);
		flex-shrink:0;
	}
	.search-box{ flex:1; min-width:200px; }
	.search-box input{
		border:none;
		outline:none;
		font-size:14px;
		flex:1;
		background:transparent;
		color:var(--text-main);
	}
	.search-box input::placeholder{ color:#9ca3af; }

	/* ===== 테이블 ===== */
	.table-card{
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:var(--radius);
		overflow:hidden;
	}
	.table-card table{ width:100%; border-collapse:collapse; }
	.table-card thead th{
		text-align:left;
		font-size:13px;
		font-weight:600;
		color:var(--text-muted);
		padding:14px 20px;
		border-bottom:1px solid var(--border-color);
		background:#fafafa;
	}
	.table-card tbody td{
		padding:16px 20px;
		font-size:14px;
		border-bottom:1px solid var(--border-color);
		vertical-align:middle;
	}
	.table-card tbody tr:last-child td{ border-bottom:none; }
	.table-card tbody tr:hover{ background:#fafafa; }

	/* 강의명 셀: 홈페이지 카드의 img-placeholder 톤을 그대로 축소해서 재사용 */
	.course-name{ display:flex; align-items:center; gap:12px; }
	.course-thumb-sm{
		width:44px; height:44px;
		border-radius:6px;
		background:#e2e8f0;
		color:#94a3b8;
		display:flex;
		align-items:center;
		justify-content:center;
		font-size:16px;
		flex-shrink:0;
	}
	.course-title-text{ font-weight:500; color:var(--text-main); }
	.course-category-text{ font-size:12px; color:var(--text-muted); margin-top:2px; }

	.price-text{ color:var(--text-main); font-weight:500; }

	.badge{
		display:inline-block;
		padding:4px 10px;
		border-radius:6px;
		font-size:12px;
		font-weight:600;
	}
	.badge-active{ background:var(--green-bg); color:var(--green-text); }
	.badge-suspended{ background:var(--red-bg); color:var(--red-text); }
	.badge-pending{ background:var(--yellow-bg); color:var(--yellow-text); }

	.btn-detail{
		padding:7px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.btn-detail:hover{ background:#f3f4f6; }

	/* ===== 페이지네이션 ===== */
	.pagination{
		display:flex;
		align-items:center;
		justify-content:space-between;
		padding:16px 20px;
		font-size:14px;
		color:var(--text-muted);
		flex-wrap:wrap;
		gap:12px;
	}
	.pagination b{ color:var(--text-main); }
	.page-controls{ display:flex; align-items:center; gap:4px; }
	.page-btn{
		width:32px; height:32px;
		display:flex;
		align-items:center;
		justify-content:center;
		border:1px solid var(--border-color);
		background:#fff;
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.page-btn:hover{ background:#f3f4f6; }
	.page-btn.active{
		background:var(--main-color);
		border-color:var(--main-color);
		color:#fff;
	}
	.page-btn.nav{ color:var(--text-muted); }

	@media (max-width:900px){
		.main{ padding:20px; }
	}
</style>

<div class="layout">
<!-- ================= Main ================= -->
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">강의관리</h1>
			<p class="page-desc">등록된 강의의 판매 상태와 정보를 조회하고 관리합니다.</p>
		</div>
		<button class="btn-primary">
			<i class="fa-solid fa-plus"></i>
			새 강의 등록
		</button>
	</div>

	<div class="filters">
		<div class="select-box">
			카테고리: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="select-box">
			상태: <span class="muted">전체 상태</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="search-box">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input type="text" placeholder="강의명 또는 강사명으로 검색...">
		</div>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>강의</th>
					<th>강사</th>
					<th>가격</th>
					<th>상태</th>
					<th>등록일</th>
					<th style="text-align:right;">관리&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</th>
				</tr>
			</thead>
			<tbody id="course-table-body">
				<!-- rows injected by JS -->
			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>34</b>개 중 <b>1-7</b> 표시</div>
			<div class="page-controls">
				<button class="page-btn nav"><i class="fa-solid fa-chevron-left"></i></button>
				<button class="page-btn active">1</button>
				<button class="page-btn">2</button>
				<button class="page-btn">3</button>
				<button class="page-btn">4</button>
				<button class="page-btn nav"><i class="fa-solid fa-chevron-right"></i></button>
			</div>
		</div>
	</div>

</main>
</div>
<script>
	const courses = [
		{ no:1, title:"스프링 부트로 배우는 백엔드 개발", category:"백엔드", instructor:"이지영", price:"88,000원", status:"판매중",   date:"2024.02.10" },
		{ no:2, title:"Vue3 + Pinia 실전 프론트엔드",       category:"프론트엔드", instructor:"정우성", price:"77,000원", status:"판매중",   date:"2024.02.08" },
		{ no:3, title:"오라클 DB 기초부터 실무까지",         category:"데이터베이스", instructor:"이지영", price:"65,000원", status:"판매중지", date:"2024.02.02" },
		{ no:4, title:"자바 알고리즘 트레이닝",              category:"알고리즘",   instructor:"정우성", price:"55,000원", status:"임시저장", date:"2024.01.28" },
		{ no:5, title:"타입스크립트 실전 입문",              category:"프론트엔드", instructor:"이지영", price:"49,000원", status:"판매중",   date:"2024.01.20" },
		{ no:6, title:"MyBatis로 배우는 매퍼 설계",          category:"백엔드",     instructor:"정우성", price:"69,000원", status:"판매중",   date:"2024.01.15" },
		{ no:7, title:"파이썬 데이터 분석 기초",              category:"데이터분석", instructor:"이지영", price:"59,000원", status:"판매중지", date:"2024.01.09" },
	];

	const statusMap = {
		"판매중": "badge-active",
		"판매중지": "badge-suspended",
		"임시저장": "badge-pending",
	};

	const tbody = document.getElementById("course-table-body");
	tbody.innerHTML = courses.map(c => `
		<tr>
			<td>${c.no}</td>
			<td>
				<div class="course-name">
					<div class="course-thumb-sm"><i class="fa-regular fa-image"></i></div>
					<div>
						<div class="course-title-text">${c.title}</div>
						<div class="course-category-text">${c.category}</div>
					</div>
				</div>
			</td>
			<td>${c.instructor}</td>
			<td class="price-text">${c.price}</td>
			<td><span class="badge ${statusMap[c.status]}">${c.status}</span></td>
			<td>${c.date}</td>
			<td style="text-align:right;">
				<button class="btn-detail">상세보기</button>
			</td>
		</tr>
	`).join("");
</script>

</html>
