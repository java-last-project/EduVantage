
<div class="layout">
  <!-- ================= Main ================= -->
  <main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">회원관리</h1>
			<p class="page-desc">가입된 플랫폼 회원의 상태를 조회하고 권한 및 계정을 관리합니다.</p>
		</div>
	</div>

	<div class="filters">
	<form th:action="@{/admin/member}" method="get" style="display: contents;">
	<div class="select-box">
	회원 구분: 
		<select class="native-select" name="authority" onchange="this.form.submit()">
			<option value="all" th:selected="${authority==null or authority=='all'}">전체</option>
			<option value="ROLE_USER" th:selected="${authority=='ROLE_USER'}">일반</option>
			<option value="ROLE_INSTRUCTOR" th:selected="${authority=='ROLE_INSTRUCTOR'}">강사</option>
			<option value="ROLE_ADMIN" th:selected="${authority=='ROLE_ADMIN'}">관리자</option>
		</select>
		<i class="fa-solid fa-chevron-down"></i>
	</div>
	<div class="select-box">
	상태:  
		<select class="native-select" name="enabled" onchange="this.form.submit()">
			<option value="-1" th:selected="${enabled==null or enabled=='-1'}">전체 상태</option>
			<option value="1" th:selected="${enabled=='1'}">정상</option>
			<option value="0" th:selected="${enabled=='0'}">휴면</option>
			<option value="2" th:selected="${enabled=='2'}">정지</option>
		</select>
		<i class="fa-solid fa-chevron-down"></i>
	</div>
		</form>
		<form th:action="@{/admin/member}" method="get">
			<div class="search-box">
				<i class="fa-solid fa-magnifying-glass"></i>
				<input type="text" name="name" th:value="${name}" placeholder="이름으로 검색...">
				<button type="submit" class="btn-light-custom"><i class="fa-solid fa-magnifying-glass"></i></button>
			</div>
		</form>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>ID</th>
					<th>이름</th>
					<th>가입일</th>
					<th>구분</th>
					<th>상태</th>
					<th style="text-align:right;">관리</th>
				</tr>
			</thead>
			<tbody id="member-table-body">
			
				<!-- 반복 -->
				<tr th:each="vo:${list}">
					<td>[[${vo.MEMBER_ID}]]</td>
					<td>[[${vo.USERNAME}]]</td>
					<td>
						<div class="member-name">
							<span class="name-text">[[${vo.NAME}]]</span>
						</div>
					</td>
					<td>[[${vo.DBDAY}]]</td>
					<td th:switch=${vo.AUTHORITY}>
						<span th:case="'ROLE_ADMIN'" class="role-admin">관리자</span>
						<span th:case="'ROLE_INSTRUCTOR'" class="role-instructor">강사</span>
						<span th:case="'ROLE_USER'" class="role-user">일반</span>
					</td>
					
					<td th:switch=${vo.ENABLED}>
						<span th:case="'1'" class="badge badge-active">정상</span>
						<span th:case="'0'" class="badge badge-pending">휴면</span>
						<span th:case="'0'" class="badge badge-suspended">정지</span>					
					</td>
					<td style="text-align:right;">
						<button class="btn-detail">상세보기</button>
					</td>
				</tr>
				
			</tbody>
		</table>

		<div class="pagination">
		
			<div th:if="${isSearch==true}">검색결과 <b>[[${count}]]</b>건</div>
			<div th:if="${isSearch==false}">전체 <b>[[${count}]]</b>명 중 <b>[[${startNum}]]-[[${endNum}]]</b> 표시</div>
			
			<div th:if="${isSearch==false}" class="page-controls">
				<button th:if="${startPage > 1}" class="page-btn nav"><a th:href="@{/admin/member(page=${startPage-1}, authority=${authority}, enabled=${enabled})}"><i class="fa-solid fa-chevron-left"></i></a></button>
				<button th:each="i:${#numbers.sequence(startPage,endPage)}" th:class="${curpage==i}?'page-btn active':'page-btn'"><a th:href="@{/admin/member(page=${i}, authority=${authority}, enabled=${enabled})}">[[${i}]]</a></button>
				<button th:if="${endPage < totalpage}" class="page-btn nav"><a th:href="@{/admin/member(page=${endPage+1}, authority=${authority}, enabled=${enabled})}"><i class="fa-solid fa-chevron-right"></i></a></button>
			</div>
		</div>
	</div>
	

</main>
</div>
<script>
	function selectedValue() {
		this.form.submit()
	}
</script>
