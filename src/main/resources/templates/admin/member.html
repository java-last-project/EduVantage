<html>
<style>
	/* main.css에 없는, 이 페이지 전용 값만 정의 */
	:root{
		--green-bg:#dcfce7; --green-text:#16a34a;
		--red-bg:#fee2e2;   --red-text:#dc2626;
		--yellow-bg:#fef9c3; --yellow-text:#a16207;
		--radius:10px;
	}

	.layout{
		display:flex;
		flex:1;
		background:#f5f6f8;
	}

	.main{
		flex:1;
		min-width:0;
		padding:32px 40px;
	}

	/* ===== 헤더 영역 ===== */
	.page-header{
		display:flex;
		justify-content:space-between;
		align-items:flex-start;
		margin-bottom:24px;
		flex-wrap:wrap;
		gap:12px;
	}
	.page-title{
		font-size:26px;
		font-weight:700;
		margin:0 0 6px;
		color:var(--text-main);
	}
	.page-desc{
		font-size:14px;
		color:var(--text-muted);
		margin:0;
	}
	.btn-export{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:var(--text-main);
		cursor:pointer;
		white-space:nowrap;
	}
	.btn-export:hover{ background:#f9fafb; }

	/* ===== 필터 영역 ===== */
	.filters{
		display:flex;
		gap:12px;
		margin-bottom:16px;
		flex-wrap:wrap;
	}
	.select-box, .search-box{
		display:flex;
		align-items:center;
		gap:8px;
		padding:10px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		color:var(--text-main);
	}
	.select-box{ cursor:pointer; white-space:nowrap; }
	.select-box .muted{ color:var(--text-muted); }
	.select-box i, .search-box i{
		font-size:12px;
		color:var(--text-muted);
		flex-shrink:0;
	}
	.search-box{ flex:1; min-width:200px; }
	.search-box input{
		border:none;
		outline:none;
		font-size:14px;
		flex:1;
		background:transparent;
		color:var(--text-main);
	}
	.search-box input::placeholder{ color:#9ca3af; }

	/* ===== 테이블 ===== */
	.table-card{
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:var(--radius);
		overflow:hidden;
	}
	.table-card table{ width:100%; border-collapse:collapse; }
	.table-card thead th{
		text-align:left;
		font-size:13px;
		font-weight:600;
		color:var(--text-muted);
		padding:14px 20px;
		border-bottom:1px solid var(--border-color);
		background:#fafafa;
	}
	.table-card tbody td{
		padding:16px 20px;
		font-size:14px;
		border-bottom:1px solid var(--border-color);
		vertical-align:middle;
	}
	.table-card tbody tr:last-child td{ border-bottom:none; }
	.table-card tbody tr:hover{ background:#fafafa; }

	.member-name{ display:flex; align-items:center; gap:10px; }
	.avatar{
		width:28px; height:28px;
		border-radius:50%;
		display:flex;
		align-items:center;
		justify-content:center;
		font-size:12px;
		font-weight:600;
		color:#fff;
		flex-shrink:0;
	}
	.name-text{ font-weight:500; color:var(--text-main); }

	.role-general{ color:var(--text-main); }
	.role-instructor{ color:var(--main-color); font-weight:600; }

	.badge{
		display:inline-block;
		padding:4px 10px;
		border-radius:6px;
		font-size:12px;
		font-weight:600;
	}
	.badge-active{ background:var(--green-bg); color:var(--green-text); }
	.badge-suspended{ background:var(--red-bg); color:var(--red-text); }
	.badge-pending{ background:var(--yellow-bg); color:var(--yellow-text); }

	.btn-detail{
		padding:7px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.btn-detail:hover{ background:#f3f4f6; }

	/* ===== 페이지네이션 ===== */
	.pagination{
		display:flex;
		align-items:center;
		justify-content:space-between;
		padding:16px 20px;
		font-size:14px;
		color:var(--text-muted);
		flex-wrap:wrap;
		gap:12px;
	}
	.pagination b{ color:var(--text-main); }
	.page-controls{ display:flex; align-items:center; gap:4px; }
	.page-btn{
		width:32px; height:32px;
		display:flex;
		align-items:center;
		justify-content:center;
		border:1px solid var(--border-color);
		background:#fff;
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.page-btn:hover{ background:#f3f4f6; }
	.page-btn.active{
		background:var(--main-color);
		border-color:var(--main-color);
		color:#fff;
	}
	.page-btn.nav{ color:var(--text-muted); }

	@media (max-width:900px){
		.main{ padding:20px; }
	}
</style>

<div class="layout">
  <!-- ================= Main ================= -->
  <main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">회원관리</h1>
			<p class="page-desc">가입된 플랫폼 회원의 상태를 조회하고 권한 및 계정을 관리합니다.</p>
		</div>
		<button class="btn-export">
			<i class="fa-solid fa-file-export"></i>
			CSV 내보내기
		</button>
	</div>

	<div class="filters">
		<div class="select-box">
			회원 구분: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="select-box">
			상태: <span class="muted">전체 상태</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="search-box">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input type="text" placeholder="이름 또는 이메일로 검색...">
		</div>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>이름</th>
					<th>이메일</th>
					<th>가입일</th>
					<th>구분</th>
					<th>상태</th>
					<th style="text-align:right;">관리</th>
				</tr>
			</thead>
			<tbody id="member-table-body">
				<!-- rows injected by JS -->
			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>78</b>명 중 <b>1-7</b> 표시</div>
			<div class="page-controls">
				<button class="page-btn nav"><i class="fa-solid fa-chevron-left"></i></button>
				<button class="page-btn active">1</button>
				<button class="page-btn">2</button>
				<button class="page-btn">3</button>
				<button class="page-btn">4</button>
				<button class="page-btn nav"><i class="fa-solid fa-chevron-right"></i></button>
			</div>
		</div>
	</div>
	

</main>
</div>
<script>
	const members = [
		{ no:1, name:"김민수", email:"minsu.kim@eduflow.kr", date:"2024.03.15", role:"일반", status:"정상", color:"#818cf8" },
		{ no:2, name:"이지영", email:"jiyoung.lee@eduflow.kr", date:"2024.03.14", role:"강사", status:"정상", color:"#f472b6" },
		{ no:3, name:"박준형", email:"jh.park@eduflow.kr",     date:"2024.03.12", role:"일반", status:"정지", color:"#60a5fa" },
		{ no:4, name:"최수빈", email:"subin.choi@eduflow.kr",  date:"2024.03.10", role:"일반", status:"대기", color:"#34d399" },
		{ no:5, name:"정우성", email:"ws.jung@eduflow.kr",     date:"2024.03.09", role:"강사", status:"정상", color:"#fb923c" },
		{ no:6, name:"한소희", email:"sohee.han@eduflow.kr",   date:"2024.03.05", role:"일반", status:"정상", color:"#a78bfa" },
		{ no:7, name:"윤도현", email:"dh.yoon@eduflow.kr",     date:"2024.03.02", role:"일반", status:"정지", color:"#f87171" },
	];

	const statusMap = {
		"정상": "badge-active",
		"정지": "badge-suspended",
		"대기": "badge-pending",
	};

	const tbody = document.getElementById("member-table-body");
	tbody.innerHTML = members.map(m => `
		<tr>
			<td>${m.no}</td>
			<td>
				<div class="member-name">
					<span class="avatar" style="background:${m.color}">${m.name[0]}</span>
					<span class="name-text">${m.name}</span>
				</div>
			</td>
			<td>${m.email}</td>
			<td>${m.date}</td>
			<td class="${m.role === '강사' ? 'role-instructor' : 'role-general'}">${m.role}</td>
			<td><span class="badge ${statusMap[m.status]}">${m.status}</span></td>
			<td style="text-align:right;">
				<button class="btn-detail">상세보기</button>
			</td>
		</tr>
	`).join("");
</script>
