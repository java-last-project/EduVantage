<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<style>
	:root{
		--green-bg:#dcfce7; --green-text:#16a34a;
		--red-bg:#fee2e2;   --red-text:#dc2626;
		--yellow-bg:#fef9c3; --yellow-text:#a16207;
		--radius:10px;
	}

	.layout{
		display:flex;
		flex:1;
		background:#f5f6f8;
	}

	.main{
		flex:1;
		min-width:0;
		padding:32px 40px;
	}

	/* ===== 헤더 영역 ===== */
	.page-header{
		display:flex;
		justify-content:space-between;
		align-items:flex-start;
		margin-bottom:24px;
		flex-wrap:wrap;
		gap:12px;
	}
	.page-title{
		font-size:26px;
		font-weight:700;
		margin:0 0 6px;
		color:var(--text-main);
	}
	.page-desc{
		font-size:14px;
		color:var(--text-muted);
		margin:0;
	}
	.btn-export{
		display:flex;
		align-items:center;
		gap:6px;
		padding:10px 16px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		font-weight:500;
		color:var(--text-main);
		cursor:pointer;
		white-space:nowrap;
	}
	.btn-export:hover{ background:#f9fafb; }

	/* ===== 필터 영역 ===== */
	.filters{
		display:flex;
		gap:12px;
		margin-bottom:16px;
		flex-wrap:wrap;
	}
	.select-box, .search-box{
		display:flex;
		align-items:center;
		gap:8px;
		padding:10px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:8px;
		font-size:14px;
		color:var(--text-main);
	}
	.select-box{ cursor:pointer; white-space:nowrap; }
	.select-box .muted{ color:var(--text-muted); }
	.select-box i, .search-box i{
		font-size:12px;
		color:var(--text-muted);
		flex-shrink:0;
	}
	.search-box{ flex:1; min-width:200px; }
	.search-box input{
		border:none;
		outline:none;
		font-size:14px;
		flex:1;
		background:transparent;
		color:var(--text-main);
	}
	.search-box input::placeholder{ color:#9ca3af; }

	/* ===== 테이블 ===== */
	.table-card{
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:var(--radius);
		overflow:hidden;
	}
	.table-card table{ width:100%; border-collapse:collapse; }
	.table-card thead th{
		text-align:left;
		font-size:13px;
		font-weight:600;
		color:var(--text-muted);
		padding:14px 20px;
		border-bottom:1px solid var(--border-color);
		background:#fafafa;
	}
	.table-card tbody td{
		padding:16px 20px;
		font-size:14px;
		border-bottom:1px solid var(--border-color);
		vertical-align:middle;
	}
	.table-card tbody tr:last-child td{ border-bottom:none; }
	.table-card tbody tr:hover{ background:#fafafa; }

	.inquiry-title-text{ font-weight:500; color:var(--text-main); }
	.category-tag{
		display:inline-block;
		padding:3px 8px;
		border-radius:5px;
		font-size:12px;
		background:var(--bg-light-blue, #eff6ff);
		color:var(--main-color, #2563eb);
	}
	.author-text, .date-text{ color:var(--text-muted); }

	.badge{
		display:inline-block;
		padding:4px 10px;
		border-radius:6px;
		font-size:12px;
		font-weight:600;
	}
	.badge-active{ background:var(--green-bg); color:var(--green-text); }
	.badge-suspended{ background:var(--red-bg); color:var(--red-text); }
	.badge-pending{ background:var(--yellow-bg); color:var(--yellow-text); }

	.btn-detail{
		padding:7px 14px;
		background:#ffffff;
		border:1px solid var(--border-color);
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.btn-detail:hover{ background:#f3f4f6; }
	.btn-detail.urgent{
		background:var(--main-color);
		border-color:var(--main-color);
		color:#fff;
	}
	.btn-detail.urgent:hover{ background:var(--main-hover); }

	/* ===== 페이지네이션 ===== */
	.pagination{
		display:flex;
		align-items:center;
		justify-content:space-between;
		padding:16px 20px;
		font-size:14px;
		color:var(--text-muted);
		flex-wrap:wrap;
		gap:12px;
	}
	.pagination b{ color:var(--text-main); }
	.page-controls{ display:flex; align-items:center; gap:4px; }
	.page-btn{
		width:32px; height:32px;
		display:flex;
		align-items:center;
		justify-content:center;
		border:1px solid var(--border-color);
		background:#fff;
		border-radius:6px;
		font-size:13px;
		color:var(--text-main);
		cursor:pointer;
	}
	.page-btn:hover{ background:#f3f4f6; }
	.page-btn.active{
		background:var(--main-color);
		border-color:var(--main-color);
		color:#fff;
	}
	.page-btn.nav{ color:var(--text-muted); }

	@media (max-width:900px){
		.main{ padding:20px; }
	}
</style>

<div class="layout">
<!-- ================= Main ================= -->
<main class="main">

	<div class="page-header">
		<div>
			<h1 class="page-title">문의하기 답변</h1>
			<p class="page-desc">회원이 남긴 1:1 문의를 확인하고 답변 상태를 관리합니다.</p>
		</div>
		<button class="btn-export">
			<i class="fa-solid fa-file-export"></i>
			CSV 내보내기
		</button>
	</div>

	<div class="filters">
		<div class="select-box">
			카테고리: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="select-box">
			답변상태: <span class="muted">전체</span>
			<i class="fa-solid fa-chevron-down"></i>
		</div>
		<div class="search-box">
			<i class="fa-solid fa-magnifying-glass"></i>
			<input type="text" placeholder="제목 또는 작성자로 검색...">
		</div>
	</div>

	<div class="table-card">
		<table>
			<thead>
				<tr>
					<th style="width:60px;">No</th>
					<th>제목</th>
					<th>카테고리</th>
					<th>작성자</th>
					<th>답변상태</th>
					<th>등록일</th>
					<th style="text-align:right;">관리</th>
				</tr>
			</thead>
			<tbody id="inquiry-table-body">
				<!-- rows injected by JS -->
			</tbody>
		</table>

		<div class="pagination">
			<div>전체 <b>43</b>건 중 <b>1-7</b> 표시</div>
			<div class="page-controls">
				<button class="page-btn nav"><i class="fa-solid fa-chevron-left"></i></button>
				<button class="page-btn active">1</button>
				<button class="page-btn">2</button>
				<button class="page-btn">3</button>
				<button class="page-btn">4</button>
				<button class="page-btn nav"><i class="fa-solid fa-chevron-right"></i></button>
			</div>
		</div>
	</div>

</main>
</div>

<script>
	const inquiries = [
		{ no:1, title:"결제한 강의가 마이페이지에 안 보여요",     category:"결제", author:"김민수", status:"미답변",   date:"2024.03.15" },
		{ no:2, title:"환불 절차가 궁금합니다",                   category:"결제", author:"박준형", status:"미답변",   date:"2024.03.14" },
		{ no:3, title:"강의 영상이 재생되지 않아요",               category:"강의", author:"최수빈", status:"답변완료", date:"2024.03.12" },
		{ no:4, title:"비밀번호를 재설정하고 싶어요",               category:"계정", author:"한소희", status:"답변완료", date:"2024.03.10" },
		{ no:5, title:"수료증 발급은 어떻게 받나요",               category:"기타", author:"윤도현", status:"미답변",   date:"2024.03.09" },
		{ no:6, title:"강사 프로필 정보를 수정하고 싶어요",         category:"계정", author:"정우성", status:"답변완료", date:"2024.03.07" },
		{ no:7, title:"세금계산서 발행 요청드립니다",               category:"결제", author:"이지영", status:"답변완료", date:"2024.03.05" },
	];

	const statusMap = {
		"답변완료": "badge-active",
		"미답변": "badge-suspended",
	};

	const tbody = document.getElementById("inquiry-table-body");
	tbody.innerHTML = inquiries.map(q => `
		<tr>
			<td>${q.no}</td>
			<td class="inquiry-title-text">${q.title}</td>
			<td><span class="category-tag">${q.category}</span></td>
			<td class="author-text">${q.author}</td>
			<td><span class="badge ${statusMap[q.status]}">${q.status}</span></td>
			<td class="date-text">${q.date}</td>
			<td style="text-align:right;">
				<button class="btn-detail ${q.status === '미답변' ? 'urgent' : ''}">${q.status === '미답변' ? '답변하기' : '상세보기'}</button>
			</td>
		</tr>
	`).join("");
</script>

</html>
