<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 Internal Server Error</title>
</head>
<body style="text-align: center; padding: 60px 20px;">
    <img src="/icon/500error.png" alt="서버 오류" style="max-width: 550px; width: 100%; margin-bottom: 20px;">
    <h2>서버 내부 오류가 발생했습니다 (500)</h2>

    <button type="button" onclick="history.back()" style="padding: 12px 24px; background: #5a5cff; color: #fff; border: none; border-radius: 6px; cursor: pointer;">
        이전 페이지로 돌아가기
    </button>

</html>
