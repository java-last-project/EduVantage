<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
</head>
<body style="text-align: center; padding: 60px 20px;">
    <img src="/icon/404error.png" alt="페이지 없음" style="max-width: 550px; width: 100%; margin-bottom: 20px;">
    <h2>페이지를 찾을 수 없습니다 (404)</h2>
    <p style="color: #666; margin-bottom: 30px;">요청하신 페이지가 존재하지 않거나 삭제되었습니다.</p>
    <button type="button" onclick="history.back()" style="padding: 12px 24px; background: #5a5cff; color: #fff; border: none; border-radius: 6px; cursor: pointer;">
        이전 페이지로 돌아가기
    </button>
</body>
</html>
