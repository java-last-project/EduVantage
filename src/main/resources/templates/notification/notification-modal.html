<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>

<!-- 알림 모달 -->
<div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel" aria-hidden="true" th:fragment="notificationModal">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content" style="border-radius: 12px; border: 1px solid var(--border-color);">

            <!-- 헤더 -->
            <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="modal-title fw-bold mb-0" id="notificationModalLabel">알림</h5>
                    <span class="badge rounded-pill text-white"
                          style="background-color: var(--main-color); font-size: 12px;"
                          th:if="${notifications != null and !notifications.isEmpty()}"
                          th:text="${notifications.size()}">3</span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn btn-link btn-sm text-decoration-none p-0"
                            style="font-size: 13px; color: var(--text-muted);">
                        모두 읽음으로 표시
                    </button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>

            <div class="">
                <div>읽음</div>
                <div>안읽음</div>
            </div>

            <!-- 알림 목록 -->
            <th:block th:include="../templates/notification/notification-list"></th:block>

            <!-- 푸터 -->
            <div class="modal-footer justify-content-center" style="border-top: 1px solid var(--border-color);">
                <a href="#" class="text-decoration-none" style="font-size: 13px; color: var(--text-muted);">알림 전체보기</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
