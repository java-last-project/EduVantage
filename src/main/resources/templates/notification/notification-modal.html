<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>

<!-- 알림 모달 -->
<div class="modal fade" id="notificationModal" th:fragment="notificationModal">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content" style="height: 600px;border-radius: 12px; border: 1px solid var(--border-color);">

            <!-- 헤더 -->
            <div class="modal-header gap-5" style="border-bottom: 1px solid var(--border-color);">
                <span class="modal-title fw-bold mb-0" id="notificationModalLabel">알림</span>
                <button type="button" class="btn-close btn-sm rounded-pill" style="background-color: lightgray" data-bs-dismiss="modal"></button>
            </div>

            <!-- 탭 -->
            <div class="d-flex gap-3 justify-content-center align-items-center py-2">
                <button
                    v-for="tab in tabs"
                    :key="tab"
                    :class="{active: activeTab === tab}"
                    @click="setActiveTab(tab)"
                >
                    {{tab}}
                </button>
            </div>

            <!-- 알림 목록 -->
            <!-- 본문: 알림 리스트 -->
            <div class="modal-body p-0">
                <ul class="list-group list-group-flush" v-if="filteredList.length > 0">
                    <li class="list-group-item d-flex gap-3 py-3 px-4"
                        v-for="notification in filteredList"
                        :key="notification.no"
                        :class="notification.read === 'false' ?
                            'notification-unread'
                            : 'notification-read'"
                    @click="handleClick(notification)">
                        <!-- 아이콘 -->
                        <div class="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
                             style="width: 40px; height: 40px;"
                             :class="notification.read === false ?
                            'notification-unread'
                            : 'notification-read'">
                            <i v-if="notification.type === 'COURSE_COMPLETED'" class="fa-solid fa-award"></i>
                            <i v-else-if="notification.type === 'EXAM_SUBSCRIBED'" class="fa-solid fa-calendar-check"></i>
                            <i v-else class="fa-solid fa-bell"></i>
                        </div>

                        <!-- 텍스트 영역 -->
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start">
                                <span class="fw-semibold" style="font-size: 14px;">{{notification.title}}</span>
                                <span v-if="notification.read === false" class="rounded-circle bg-primary flex-shrink-0"
                                      style="width: 8px; height: 8px; margin-top: 6px;"></span>
                            </div>
                            <p class="mb-1" style="font-size: 13px; color: var(--text-muted);">{{notification.content}}</p>
                            <span style="font-size: 12px; color: #94a3b8;">{{notification.regdate.replace('T',' ').substring(0,16)}}</span>
                        </div>
                    </li>
                </ul>

                <!-- 알림이 없을 때 -->
                <div class="d-flex flex-column align-items-center justify-content-center h-100 py-5" v-if="filteredList.length === 0">
                    <i class="fa-solid fa-bell-slash" style="font-size: 32px; color: #cbd5e1;"></i>
                    <p class="mt-3 mb-0" style="font-size: 14px; color: var(--text-muted);">새로운 알림이 없습니다.</p>
                </div>
            </div>

            <!-- 푸터 -->
            <div class="modal-footer justify-content-center" style="border-top: 1px solid var(--border-color);">
                <button type="button"
                        class="btn btn-link btn-sm text-decoration-none p-0"
                        @click="markAllRead"
                        style="font-size: 13px; color: var(--text-muted);">
                    모두 읽음으로 표시
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
