<!-- 본문: 알림 리스트 -->
<div class="modal-body p-0">
    <ul class="list-group list-group-flush" th:if="${notifications != null and !notifications.isEmpty()}">
        <li class="list-group-item d-flex gap-3 py-3 px-4"
            th:each="notification : ${notifications}"
            th:style="${notification.is_read == 'N'} ? 'background-color: var(--bg-light-blue);' : ''">

            <!-- 아이콘 -->
            <div class="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
                 style="width: 40px; height: 40px; background-color: var(--bg-light-blue); color: var(--main-color);">
                <i class="fa-solid fa-bell"></i>
            </div>

            <!-- 텍스트 영역 -->
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                    <span class="fw-semibold" style="font-size: 14px;" th:text="${notification.title}">알림 제목</span>
                    <span class="rounded-circle bg-primary flex-shrink-0"
                          style="width: 8px; height: 8px; margin-top: 6px;"
                          th:if="${notification.is_read == 'N'}"></span>
                </div>
                <p class="mb-1" style="font-size: 13px; color: var(--text-muted);" th:text="${notification.content}">알림 내용</p>
                <span style="font-size: 12px; color: #94a3b8;"
                      th:text="${#dates.format(notification.regdate, 'yyyy-MM-dd HH:mm')}">2026-08-27 12:00</span>
            </div>
        </li>
    </ul>

    <!-- 알림이 없을 때 -->
    <div class="text-center py-5" th:if="${notifications == null or notifications.isEmpty()}">
        <i class="fa-solid fa-bell-slash" style="font-size: 32px; color: #cbd5e1;"></i>
        <p class="mt-3 mb-0" style="font-size: 14px; color: var(--text-muted);">새로운 알림이 없습니다.</p>
    </div>
</div>
