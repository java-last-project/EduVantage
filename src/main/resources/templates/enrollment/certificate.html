<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
  .certificate-box {
    max-width: 700px;
    margin: 60px auto;
    padding: 60px;
    border: 6px double #343a40;
    text-align: center;
    background: #fff;
  }
  @media print {
    body * { visibility: hidden; }
    #cert-print-area, #cert-print-area * { visibility: visible; }
    #cert-print-area { position: absolute; left: 0; top: 0; width: 100%; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div class="flex-grow-1 p-4" id="cert-print-area">
  <div class="certificate-box">
    <div class="text-secondary mb-3" style="letter-spacing: 4px;">CERTIFICATE OF COMPLETION</div>
    <h2 class="fw-bold mb-4">수 료 증</h2>
    <p class="mb-1">성명 : <strong>[[${session.name}]]</strong></p>
    <p class="mb-4">과정명 : <strong>[[${title}]]</strong></p>
    <p class="text-secondary">위 사람은 본 과정을 성실히 이수하였음을 증명합니다.</p>
    <p class="mt-4 mb-0" th:text="${#temporals.format(#temporals.createNow(),'yyyy년 MM월 dd일')}"></p>
    <p class="fw-bold mt-2">EduVantage</p>
  </div>
  <div class="text-center no-print">
    <button class="btn btn-dark px-4" onclick="window.print()">인쇄하기</button>
  </div>
</div>
</body>
</html>
