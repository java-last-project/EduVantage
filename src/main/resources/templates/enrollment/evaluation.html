<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div class="flex-grow-1 p-4">
  <div class="card border mb-3">
    <div class="card-body d-flex align-items-center gap-3">
      <img th:src="${vo.thumbnail}" style="height: 100px">
      <div class="flex-grow-1" style="min-width: 0;">
        <div class="fw-bold text-truncate">[[${vo.title}]]</div>
        <div class="text-secondary small">[[${vo.instructor}]]</div>
      </div>
      <div class="text-center flex-shrink-0" style="width: 130px;">
        <div class="fs-3 fw-bold">[[${vo.star}]]</div>
        <div style="color: #f5a623; letter-spacing: 1px;">★★★★☆</div>
        <div class="d-flex justify-content-center gap-1 mt-1">
          <span class="badge rounded-pill text-bg-light border small">리뷰 [[${eCount}]]개</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 리뷰 작성 -->
  <div class="card border mb-3">
    <div class="card-body">
      <h6 class="fw-bold mb-3">리뷰 작성</h6>

      <div class="mb-3">
        <div class="text-secondary small mb-1">별점 선택</div>
        <div style="font-size: 22px; letter-spacing: 2px; color: #dee2e6; cursor: pointer;">
          ★★★★★
        </div>
      </div>

      <div class="mb-2">
        <div class="text-secondary small mb-1">강의평 입력</div>
        <textarea class="form-control" rows="4" maxlength="500" placeholder="수강하신 강의는 어떠셨나요? 솔직한 후기를 남겨주세요."></textarea>
        <div class="text-secondary small text-end mt-1">0 / 500자</div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-dark btn-sm px-3">등록</button>
      </div>
    </div>
  </div>

  <div class="card border">
    <div class="card-body p-0">

      <div th:each="evo:${eList}"
           class="d-flex align-items-start gap-3 p-3" style="border-bottom: 1px solid #f1f3f5;">
        <div class="bg-light rounded-circle flex-shrink-0" style="width: 44px; height: 44px;"></div>
        <div class="flex-grow-1" style="min-width: 0;">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <div class="d-flex align-items-center gap-2">
              <span class="fw-semibold small">[[${evo.name}]]</span>
              <span style="color: #f5a623; font-size: 13px; letter-spacing: 1px;">
			    <span th:each="i : ${#numbers.sequence(1,5)}" 
			      th:text="${i <= evo.rating} ? '★' : '☆'"></span>
			  </span>
            </div>
            <span class="text-secondary small flex-shrink-0">[[${evo.dbday}]]</span>
          </div>
          <div class="text-secondary small mb-2">[[${evo.review}]]</div>
          <button class="btn btn-outline-secondary btn-sm px-2 py-0" style="font-size: 12px;">
            👍 좋아요 [[${evo.like_count}]]
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
