<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
.content-body img {
  max-width: 100%;
  height: auto;
}
.content-body svg {
  max-width: 24px;
  height: auto;
}
</style>
</head>
<body>
  <div class="flex-grow-1 p-4">

    <div class="row g-3">
      <div class="col-lg-8">
      	<div class="card border mb-3">
		  <div class="row g-0">
		    <div class="col-md-5">
		      <div class="bg-dark d-flex align-items-center justify-content-center rounded-start" style="height: 220px; overflow: hidden;">
		        <img th:src="${vo.thumbnail}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
		      </div>
		    </div>
		    <div class="col-md-7">
		      <div class="card-body d-flex flex-column justify-content-between" style="height: 220px;">
		
		        <div>
		          <span class="badge rounded-pill text-primary bg-primary-subtle mb-2">개발 · 웹개발</span>
		          <h4 class="fw-bold">[[${vo.title}]]</h4>
		        </div>
	
		        <div class="d-flex justify-content-between align-items-center">
		          <span class="text-secondary">[[${vo.instructor}]]</span>
		          <span class="text-warning fs-5">
		            ★ [[${vo.star}]]
		            <span class="text-secondary small">([[${vo.student_count}]]명 수강 중)</span>
		          </span>
		        </div>
		
		      </div>
		    </div>
		  </div>
		</div>

        <ul class="nav nav-tabs mb-3">
          <li class="nav-item"><a class="nav-link active" href="#">소개</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="#">관련 도서</a></li>
        </ul>

        <div class="card border mb-4">
  <div class="card-body">
    <div class="content-body text-secondary" style="line-height: 1.8; overflow-wrap: break-word;" th:utext="${vo.content}"></div>
  </div>
</div>

      </div>

      <div class="col-lg-3">
        <div class="card border">
          <div class="card-body">
            <h6 class="fw-bold mb-3">나의 학습 진행률</h6>
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="rounded-circle border border-4 border-primary d-flex align-items-center justify-content-center flex-shrink-0"
                   style="width: 56px; height: 56px;">
              </div>
              <div>
                <div class="fw-bold text-primary">40% 수강 완료</div>
                <div class="text-secondary small">전체 24개 중 10개 완료</div>
              </div>
            </div>
            <div class="progress mb-3" style="height: 6px;">
              <div class="progress-bar" role="progressbar" style="width: 40%"
                   aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <a href="#" class="btn btn-dark w-100">수료증 발급하기</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
