<!DOCTYPE html>
<html>
<style>
.hide-scrollbar::-webkit-scrollbar { 
	display: none; 
}
.course-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.course-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; 
}
</style>
    <main class="container" style="max-width: 1200px; padding-bottom: 100px;">
    
    <!-- 검색창 (각 페이지에 갖고가서 쓰면 되요) -->
    
    <!--  
	<section class="hero-title-section">
		<div class="d-flex justify-content-center px-3">
			<form action="/category/search" class="w-100" method="get" style="max-width: 600px;">
				<div class="position-relative w-100" style="max-width: 600px;">
					<input type="text" class="search-input-rounded" placeholder="검색어를 입력하세요...">
					<button type="button" class="search-btn-inside" aria-label="검색">
						<i class="fa-solid fa-magnifying-glass"></i>
					</button>
				</div>
			</form>
		</div>
	</section>
	-->

    <section class="mb-5 pb-4" style="margin-top: 20px">
        <div id="mainBannerCarousel" class="carousel carousel-dark slide rounded-3 overflow-hidden" data-bs-ride="carousel">
            <!-- 하단 인디케이터 (버튼) -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mainBannerCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#mainBannerCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#mainBannerCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            
            <!-- 슬라이드 아이템 -->
            <div class="carousel-inner">
                <!-- 슬라이드 1 -->
                <div class="carousel-item active" data-bs-interval="4000">
                    <div class="img-placeholder" style="height: 350px; width: 100%;">
                        <i class="fa-regular fa-image fa-3x"></i>
                        <span class="ms-3 text-muted fw-bold">첫 번째 추천 강의/도서 배너</span>
                    </div>
                </div>
                <!-- 슬라이드 2 -->
                <div class="carousel-item" data-bs-interval="4000">
                    <div class="img-placeholder" style="height: 350px; width: 100%;">
                        <i class="fa-regular fa-image fa-3x"></i>
                        <span class="ms-3 text-muted fw-bold">두 번째 추천 강의/도서 배너</span>
                    </div>
                </div>
                <!-- 슬라이드 3 -->
                <div class="carousel-item" data-bs-interval="4000">
                    <div class="img-placeholder" style="height: 350px; width: 100%;">
                        <i class="fa-regular fa-image fa-3x"></i>
                        <span class="ms-3 text-muted fw-bold">세 번째 추천 강의/도서 배너</span>
                    </div>
                </div>
            </div>
            
            <!-- 좌우 이동 컨트롤 -->
            <button class="carousel-control-prev" type="button" data-bs-target="#mainBannerCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">이전</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainBannerCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">다음</span>
            </button>
        </div>
    </section>

    <!-- 중단 가로형 리스트 영역 -->
    <section class="mb-5 pb-4">
        <div class="d-flex justify-content-between align-items-end mb-3 px-3">
            <div>
                <h3 class="section-heading mb-1">🔥 신규 등록 강의</h3>
                <p class="section-subheading mb-0">방금 올라온 따끈따끈한 새 강의를 만나보세요.</p>
            </div>
            <a href="/course/list" class="text-decoration-none fw-bold" style="color: var(--main-color, #0d6efd);">
                전체보기 <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

		<div class="position-relative px-3 overflow-hidden">
			<button type="button" class="btn btn-light rounded-circle shadow position-absolute top-50 start-0 translate-middle-y z-3" onclick="slideCourse(-1)" style="width: 40px; height: 40px;">
				<i class="fa-solid fa-chevron-left"></i>
			</button>
            
			<div class="d-flex flex-nowrap overflow-x-auto gap-3 py-2 hide-scrollbar" id="mainCourseSlider" style="scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none;">
                
				<div th:each="c:${cList}" style="flex: 0 0 20%; min-width: 220px;">
					<div class="card h-100 border course-card" style="cursor: pointer;" th:onclick="|location.href=@{'/course/detail(no=${c.no})}|">
						<div class="position-relative" style="padding-top: 56.25%; background-color: #f8f9fa;">
							<img th:src="${c.thumbnail}" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover;">
						</div>
						<div class="card-body p-3">
							<h6 class="card-title fw-bold text-truncate-2 mb-2" style="font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${c.title}">강의 제목</h6>
							<p class="card-text text-muted small mb-2" th:text="${c.instructor}">강사명</p>
							<div class="d-flex align-items-center gap-2 small fw-medium">
								<span class="text-warning"><i class="fa-solid fa-star"></i> <span th:text="${c.star}">0.0</span></span>
								<span class="text-muted border-start ps-2">수강생 <span th:text="${c.student_count}">0</span>명</span>
							</div>
						</div>
					</div>
				</div>

            </div>

			<button type="button" class="btn btn-light rounded-circle shadow position-absolute top-50 end-0 translate-middle-y z-3" onclick="slideCourse(1)" style="width: 40px; height: 40px;">
				<i class="fa-solid fa-chevron-right"></i>
			</button>
        </div>
    </section>

    <!-- 하단 세로형 그리드 영역 -->
	<section>
		<div class="mb-3">
			<h3 class="section-heading">상시시험 바로가기</h3>
	        <p class="section-subheading">원하는 과목과 문제 수를 선택하여 즉시 모의고사를 시작하세요.</p>
		</div>
	
		<div class="row g-4">
			<div class="col-md-4">
				<div class="card-vertical shadow-sm border rounded-3 p-4 text-center h-100 d-flex flex-column justify-content-center" style="background-color: #fff;">
					<div class="exam-front">
						<div class="mb-3">
							<i class="fa-solid fa-laptop-code fa-3x" style="color: var(--main-color, #0d6efd);"></i>
						</div>
						<h5 class="fw-bold mb-1">정보처리기사</h5>
						<p class="text-muted small mb-4">상시시험</p>
						<button type="button" class="btn text-white w-100 mt-auto fw-bold" style="background-color: var(--main-color, #0d6efd);" onclick="toggleExamOptions(this)">
							응시하기
						</button>
					</div>
	
					<div class="exam-options d-none flex-column h-100 justify-content-center">
						<h6 class="fw-bold mb-3 text-dark">문제 수를 선택하세요</h6>
						<div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보처리기사',1, 20)">20제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보처리기사',1, 40)">40제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보처리기사',1, 60)">60제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보처리기사',1, 80)">80제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보처리기사',1, 100)">100제</button>
						</div>
						<button type="button" class="btn btn-light btn-sm text-muted mt-auto w-100" onclick="toggleExamOptions(this)">
							<i class="fa-solid fa-arrow-left"></i> 뒤로
						</button>
					</div>
				</div>
			</div>
			<div class="col-md-4">
				<div class="card-vertical shadow-sm border rounded-3 p-4 text-center h-100 d-flex flex-column justify-content-center" style="background-color: #fff;">
					<div class="exam-front">
						<div class="mb-3">
							<i class="fa-solid fa-laptop-code fa-3x" style="color: var(--main-color, #0d6efd);"></i>
						</div>
						<h5 class="fw-bold mb-1">정보보안기사</h5>
						<p class="text-muted small mb-4">상시시험</p>
						<button type="button" class="btn text-white w-100 mt-auto fw-bold" style="background-color: var(--main-color, #0d6efd);" onclick="toggleExamOptions(this)">
							응시하기
						</button>
					</div>
	
					<div class="exam-options d-none flex-column h-100 justify-content-center">
						<h6 class="fw-bold mb-3 text-dark">문제 수를 선택하세요</h6>
						<div class="d-flex flex-wrap gap-2 justify-content-center mb-4">
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보보안기사',2, 20)">20제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보보안기사',2, 40)">40제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보보안기사',2, 60)">60제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보보안기사',2, 80)">80제</button>
							<button class="btn btn-outline-primary btn-sm px-3" onclick="startExam('정보보안기사',2, 100)">100제</button>
						</div>
						<button type="button" class="btn btn-light btn-sm text-muted mt-auto w-100" onclick="toggleExamOptions(this)">
							<i class="fa-solid fa-arrow-left"></i> 뒤로
						</button>
					</div>
				</div>
			</div>
		</div>
	</section>

</main>
<script>
function toggleExamOptions(button) {
	const card=button.closest('.card-vertical')
	const front=card.querySelector('.exam-front')
	const options=card.querySelector('.exam-options')
	front.classList.toggle('d-none')
	options.classList.toggle('d-none')

	if (!options.classList.contains('d-none')) {
		options.style.display='flex'
	} else {
		options.style.display=''
	}
}

function startExam(subjectName,theme, count) {
	if(confirm(`${subjectName} ${count}문제를 시작하시겠습니까?`)) {
		location.href=`/exam/detail?theme=${theme}&count=${count}`
	}
}

function slideCourse(direction) {
    const slider=document.getElementById('mainCourseSlider')
    const slideAmount=slider.clientWidth
    const maxScroll=slider.scrollWidth-slider.clientWidth

    if (direction===1) {
        if (slider.scrollLeft>=maxScroll-5) {
            slider.scrollLeft=0
        } else {
            slider.scrollLeft+=slideAmount
        }
    } else {
        if (slider.scrollLeft<=5) {
            slider.scrollLeft=maxScroll
        } else {
            slider.scrollLeft-=slideAmount
        }
    }
}
</script>
</html>
