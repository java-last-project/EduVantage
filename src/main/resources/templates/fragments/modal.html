<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<th:block th:fragment="pwdModal">
    <div class="modal fade" id="pwdModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold">비밀번호 확인</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="pwdForm" method="post" action="/freeboard/pwd_check">
                    <input type="hidden" name="no" th:value="${vo.no}">
                    <input type="hidden" name="actionType" id="actionType" value="">

                    <div class="modal-body py-4">
                        <input type="password" name="pwd" class="form-control shadow-none" placeholder="게시글 비밀번호를 입력하세요" required>
                    </div>

                    <div class="modal-footer border-top-0 pt-0 d-flex justify-content-between">
                        <button type="button" class="btn btn-light px-3 rounded-3" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn text-white px-4 fw-bold rounded-3" id="modalSubmitBtn" style="background-color: #212529;">확인</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function setModalAction(actionType) {
            const actionInput=document.getElementById('actionType')
            const btn=document.getElementById('modalSubmitBtn')
            const pwdInput=document.querySelector('input[name="pwd"]')

            pwdInput.value=''
            actionInput.value=actionType

            if (actionType==='delete') {
                btn.textContent='삭제하기'
                btn.className='btn btn-danger px-4 fw-bold rounded-3'
            } else {
                btn.textContent='수정하기'
                btn.className='btn text-white px-4 fw-bold rounded-3'
                btn.style.backgroundColor = '#212529'
            }
        }
    </script>
</th:block>
</html>
