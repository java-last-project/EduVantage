<!DOCTYPE html>
<main class="container py-5" style="max-width: 1300px;" id="courseApp">
    <div class="row g-4">
        
        <aside class="col-lg-3">
            <div class="bg-white p-4 rounded-4 border sticky-top" style="top: 50px; max-height: calc(100vh - 120px); overflow-y: auto;z-index: 10">
            
				<div class="position-relative w-100 mb-3">
					<input type="text" class="search-input-rounded w-100" placeholder="검색어를 입력하세요" v-model="store.fd" @keyup.enter="store.move(1)">
					<button type="button" class="search-btn-inside position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent px-3" aria-label="검색" @click="store.move(1)"><i class="fa-solid fa-magnifying-glass"></i></button>
				</div>

                <hr class="text-muted">

                <div class="mb-4">
					<div style="font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 12px;">카테고리</div>
					<div class="form-check mb-2" v-for="(c,index) in store.catList" :key="index">
						<input class="form-check-input" type="checkbox" :value="c.category" v-model="store.categories" @change="store.move(1)">
						<label class="form-check-label text-secondary">{{c.category==='Unclassified'?'기타':c.category}}</label>
					</div>
                </div>
            </div>
        </aside>

        <section class="col-lg-9">
            
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <h6 class="fw-bold m-0">총 <span class="text-primary">{{store.count}}</span>개의 강좌</h6>
				<div class="d-flex gap-2">
					<button class="btn rounded-pill border-0 px-3 py-1" :style="(store.column==='no' || store.column==='')?'background-color: #334155; color: white;':'background-color: #f1f5f9; color: #64748b;'" @click="store.column='no'; store.move(1)">최신순</button>
					<button class="btn rounded-pill border-0 px-3 py-1" :style="store.column==='star'?'background-color: #334155; color: white;':'background-color: #f1f5f9; color: #64748b;'" @click="store.column='star'; store.move(1)">평점순</button>
					<button class="btn rounded-pill border-0 px-3 py-1" :style="store.column==='pay_price ASC'?'background-color: #334155; color: white;':'background-color: #f1f5f9; color: #64748b;'" @click="store.column='pay_price ASC'; store.move(1)">가격 낮은순</button>
					<button class="btn rounded-pill border-0 px-3 py-1" :style="store.column==='pay_price DESC'?'background-color: #334155; color: white;':'background-color: #f1f5f9; color: #64748b;'" @click="store.column='pay_price DESC'; store.move(1)">가격 높은순</button>
				</div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 mb-5">
                
                <div class="col" v-for="(vo,index) in store.cList" :key="index">
                    <div class="card h-100 border rounded-4 overflow-hidden" style="transition: transform 0.2s; cursor: pointer;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
                        <div class="position-relative" style="padding-top: 56.25%; background-color: #000;">
                            <img :src="vo.thumbnail" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover;" alt="Thumbnail">
                        </div>
                        
                        <div class="card-body p-4 d-flex flex-column">
                            <h5 class="card-title fw-bold mb-2" style="font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                {{vo.title}}
                            </h5>
                            <p class="text-muted small mb-2">{{vo.instructor}}</p>
                            
							<div class="d-flex flex-wrap gap-1 mb-3">
								<span v-for="(cat, index) in vo.categoryList" :key="index" class="badge rounded-pill bg-light text-secondary border fw-normal" style="font-size: 11px; padding: 5px 10px;">
									{{cat}}
								</span>
							</div>

                            <div class="d-flex align-items-center mb-3 small">
                                <span class="text-warning fw-bold me-1"><i class="fa-solid fa-star"></i> {{vo.star}}</span>
                                <span class="text-muted">{{vo.student_count}}명</span>
                            </div>
                            
                            <div class="mt-auto d-flex align-items-baseline gap-2">
                                <span style="color: #2563eb; font-weight: 800; font-size: 18px;">₩{{vo.pay_price}}</span>
                                <span style="text-decoration: line-title; color: #94a3b8; font-size: 13px; text-decoration: line-through;">₩{{vo.regular_price}}</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center border-0">
                    <li class="page-item" :class="store.startPage>1?'':'disabled'"><a class="page-link border-0 text-muted" style="cursor: pointer;" @click="store.startPage>1?store.move(store.startPage-1):null"><i class="fa-solid fa-chevron-left"></i></a></li>
                    <li class="page-item" v-for="(i,index) in store.range" :key="index"><a class="page-link border-0 rounded-circle mx-1 custom-page-btn" :class="{'active':store.curpage===i}" @click="store.move(i)">{{i}}</a></li>
                    <li class="page-item" :class="store.endPage<store.totalpage?'':'disabled'"><a class="page-link border-0 text-muted" style="cursor: pointer;" @click="store.endPage<store.totalpage?store.move(store.endPage+1):null"><i class="fa-solid fa-chevron-right"></i></a></li>
                </ul>
            </nav>

        </section>
    </div>
</main>
<script src="/vue/axios.js"></script>
<script src="/vue/course/courseStore.js"></script>
<script>
const {onMounted,ref,createApp}=Vue
const {createPinia}=Pinia
const courseApp=createApp({
	setup(){
		const store=useCourseStore()
		
		onMounted(()=>{
			store.courseListData()
		})
		return{
			store
		}
	}
})
courseApp.use(createPinia())
courseApp.mount('#courseApp')
</script>
