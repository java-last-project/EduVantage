<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<script th:inline="javascript">
const SESSION_NAME = /*[[${session.name}]]*/ ''
const EXAM_THEME = /*[[${theme}]]*/ 0
const EXAM_COUNT = /*[[${count}]]*/ 20
const EXAM_NO = /*[[${examNo}]]*/ null
</script>
	<div class="exam-layout">
		<th:block th:include="exam/sidebar"></th:block>
	
		<main class="exam-main">
			<header class="exam-header">
				<h2 class="fs-4 fw-bold mb-0" v-text="examTitle"></h2>
			</header>
	
			<div class="exam-content">
				<div class="flex-grow-1">     

					<div class="exam-card d-flex justify-content-between align-items-center">
						<div class="d-flex align-items-center gap-3">
							<span class="badge" style="background-color: var(--bg-light-blue); color: var(--main-color);">시험 진행 중</span>
							<h5 class="fw-bold mb-0" v-text="examTitle"></h5>
						</div>
						<div class="d-flex align-items-center gap-4 fw-medium">
							<span class="text-muted"><i class="fa-regular fa-clock"></i> 경과시간: {{fElapsedTime}}</span>
							<span class="text-danger"><i class="fa-solid fa-stopwatch"></i> 남은시간: {{fRemainingTime}}</span>
							<button class="btn text-white px-4" style="background-color: var(--main-color);" @click="submitExam">제출하기</button>
						</div>
					</div>

					<div v-for="(q,index) in store.list" :key="index" class="exam-card" :id="'q-box-'+index">
						<div class="d-flex justify-content-between mb-3">
							<span v-if="q.type === 1" class="badge bg-light text-secondary border">객관식</span>
							<span v-else class="badge border" style="background-color: #fffbeb; color: #d97706; border-color: #fde68a;">주관식</span>
							<span class="fw-bold" style="color: var(--main-color);">문제 {{index+1}} / {{store.list.length}}</span>
						</div>
						<h5 class="fw-bold mb-4" style="line-height: 1.5;">{{ q.title }}</h5>
     
						<div v-if="q.type === 1" class="d-flex flex-column gap-2">
							<label class="option-box" :class="{selected: userAnswers[q.no]==='1'}">
			                    <input type="radio" :name="'q_' + q.no" value="1" v-model="userAnswers[q.no]">
			                    <span>① {{q.ovo?.option1}}</span>
			                </label>
			                <label class="option-box" :class="{selected: userAnswers[q.no]==='2'}">
			                    <input type="radio" :name="'q_' + q.no" value="2" v-model="userAnswers[q.no]">
			                    <span>② {{q.ovo?.option2}}</span>
			                </label>
			                <label class="option-box" :class="{selected: userAnswers[q.no]==='3'}">
			                    <input type="radio" :name="'q_' + q.no" value="3" v-model="userAnswers[q.no]">
			                    <span>③ {{q.ovo?.option3}}</span>
			                </label>
			                <label class="option-box" :class="{selected: userAnswers[q.no]==='4'}">
			                    <input type="radio" :name="'q_' + q.no" value="4" v-model="userAnswers[q.no]">
			                    <span>④ {{q.ovo?.option4}}</span>
			                </label>
						</div>
	                
						<div v-else>
							<input type="text" class="form-control p-3" placeholder="정답을 입력하세요" style="border-radius: 8px;" v-model="userAnswers[q.no]">
						</div>
					</div>
				</div>
				<div class="omr-col" style="min-width: 300px;">
					<div class="exam-card">
						<h6 class="fw-bold mb-1">답안 현황</h6>
						<p class="text-muted mb-4" style="font-size: 13px;">문제를 클릭하면 해당 번호로 즉시 이동합니다.</p> 
						<div class="omr-grid mb-4" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
							<div v-for="(q, index) in store.list" :key="'omr-' + q.no" class="omr-btn text-center py-2 border rounded" 
				                :class="{ solved: userAnswers[q.no] }"
				                @click="scrollToQuestion(index)"
				                style="cursor: pointer;">
								{{index+1}}
							</div>
						</div>
				        
						<div class="d-flex justify-content-around align-items-center mb-4 py-2 border-top border-bottom" style="font-size: 12px;">
							<div class="d-flex align-items-center gap-1">
								<div style="width: 12px; height: 12px; border-radius: 2px; background-color: var(--main-color);"></div> 풀이 완료
							</div>
							<div class="d-flex align-items-center gap-1">
								<div style="width: 12px; height: 12px; border-radius: 2px; border: 2px solid var(--main-color); background-color: #fff;"></div> 현재 문제
							</div>
							<div class="d-flex align-items-center gap-1">
								<div style="width: 12px; height: 12px; border-radius: 2px; background-color: var(--bg-body);"></div> 남은 문제
							</div>
						</div>
				       
						<div class="p-3 rounded" style="background-color: var(--bg-body);">
							<div class="d-flex justify-content-between fw-bold mb-2">
								<span style="font-size: 14px;">전체 진행률</span>
								<span style="color: var(--main-color);">{{progressPercent}}%</span>
							</div>
							<div class="progress mb-2" style="height: 6px;">
								<div class="progress-bar" role="progressbar" :style="{width: progressPercent+'%', backgroundColor: 'var(--main-color)'}" :aria-valuenow="progressPercent" aria-valuemin="0" aria-valuemax="100"></div>
							</div>
							<div class="text-end text-muted" style="font-size: 12px;">풀이 완료: {{solvedCount}} / {{store.list.length}}</div>
						</div>
						<button class="btn w-100 py-3 text-white fw-bold shadow-sm"
						        style="background-color: var(--main-color); border-radius: 8px; font-size: 15px;"
						        @click="submitExam">
							<i class="fa-solid fa-paper-plane me-1"></i> 제출하기
						</button>
					</div>
				</div>
			</div>
		</main>
	</div>
<script src="/vue/exam/examStore.js"></script>
<script>
const {onMounted,onUnmounted,ref,computed,createApp}=Vue
const {createPinia}=Pinia
const examApp=createApp({
    setup(){
        const store=useExamStore()
        const userAnswers=ref({})
		const totalLimitSeconds=ref(60 * 60)
		const elapsedSeconds=ref(0)
		let timerInterval=null
		const examTitleMap = {
			1: '정보처리기사 기출문제 모의고사',
			2: '정보보안기사 기출문제 모의고사',
			3: 'SQLD 기출문제 모의고사',
			4: '리눅스 마스터 기출문제 모의고사',
			5: '빅데이터 분석기사 기출문제 모의고사'
		}
		const examTitle=computed(()=>{
			if(store.title && store.title.trim()!==''){
				return store.title
			}
			return examTitleMap[store.theme]
		})
        const scrollToQuestion=(index)=>{
			const target = document.getElementById('q-box-'+index)
			if(target) {
				target.scrollIntoView({behavior:'smooth', block:'center'})
			}
		}
		const solvedCount = computed(()=>{
			return Object.values(userAnswers.value).filter(val=>val && String(val).trim()!=='').length
		})
		const progressPercent=computed(()=>{
			if (!store.list.length) return 0
			return Math.round((solvedCount.value/store.list.length)*100)
		})
		const formatTime=(seconds)=>{
			const h=String(Math.floor(seconds/3600)).padStart(2,'0')
			const m=String(Math.floor((seconds%3600)/60)).padStart(2,'0')
			const s=String(seconds%60).padStart(2,'0')
			return `${h}:${m}:${s}`
		}
		const fElapsedTime=computed(()=>{
			return formatTime(elapsedSeconds.value)
		})
		const fRemainingTime=computed(()=>{
			const remaining = Math.max(0, totalLimitSeconds.value - elapsedSeconds.value)
			return formatTime(remaining)
		})
		const startTimer=()=>{
			timerInterval=setInterval(()=>{
				elapsedSeconds.value++

				if (elapsedSeconds.value>=totalLimitSeconds.value) {
					clearInterval(timerInterval)
					alert('시험 제한 시간이 종료되었습니다. 답안이 자동으로 제출됩니다.')
					submitExam(true)
				}
			}, 1000)
		}
		const submitExam=()=>{
			if (!confirm('시험을 최종 제출하시겠습니까?')) return
			console.log('제출 데이터:', {
				enrollment_no: store.enrollment_no,
				answers: userAnswers.value,
				spentTime: elapsedSeconds.value
			})
			// 답안 제출 API
		}
        onMounted(()=>{
            store.username=SESSION_NAME
            const requestParams={
				theme:EXAM_THEME,
				count:EXAM_COUNT,
				examNo:EXAM_NO
			}
            store.examDetailData(requestParams)

			startTimer()
        })
		onUnmounted(()=>{
			if(timerInterval) clearInterval(timerInterval)
		})
        return{
            store,
			examTitle,
			solvedCount,
			progressPercent,
            userAnswers,
			fElapsedTime,
			fRemainingTime,
			startTimer,
            scrollToQuestion,
			submitExam
        }
    }
})
examApp.use(createPinia())
examApp.mount('.exam-layout')
</script>
</html>
