<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div class="container-fluid p-3">

  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link active fw-semibold" href="#">강의 장바구니 <span class="text-secondary">(3)</span></a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-secondary" href="#">도서 장바구니 <span class="text-secondary">(2)</span></a>
    </li>
  </ul>
 
  <div class="card border border-top-0 rounded-top-0">
    <div class="card-body p-4">
 
      <!-- 전체선택 / 삭제 -->
      <div class="d-flex justify-content-between align-items-center pb-3 border-bottom">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkAll" checked>
          <label class="form-check-label" for="checkAll">전체선택 (3/3)</label>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm px-3">선택삭제</button>
          <button class="btn btn-outline-secondary btn-sm px-3">전체삭제</button>
        </div>
      </div>
 
      <!-- v-for -->
      <div class="d-flex align-items-center gap-3 py-3 border-bottom">
        <input class="form-check-input flex-shrink-0" type="checkbox" checked>
        <div class="bg-light rounded-2 flex-shrink-0" style="width: 72px; height: 72px;"></div>
        <div class="flex-grow-1">
          <div class="text-secondary" style="font-size: .75rem;">React</div>
          <div class="d-flex align-items-center gap-2">
            <span class="fw-bold">React</span>
            <span class="badge rounded-pill text-bg-light border">평생소장</span>
          </div>
          <div class="text-secondary small mt-1">담당 강사명 · 15강</div>
        </div>
        <div class="text-end flex-shrink-0">
          <div class="text-secondary text-decoration-line-through" style="font-size: .75rem;">120,000원</div>
          <div class="d-flex align-items-center gap-2">
            <span class="text-danger small">26% 할인</span>
            <span class="fw-bold">89,000원</span>
          </div>
        </div>
        <button class="btn btn-sm text-secondary flex-shrink-0" aria-label="삭제">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
 
    <div class="card-footer bg-white d-flex justify-content-between align-items-center p-4">
      <span class="text-secondary">선택 상품 <span class="fw-bold text-dark">3개</span></span>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end">
          <div class="text-secondary" style="font-size: 12px">총 결제금액</div>
          <div class="fw-bold fs-5">233,000원</div>
        </div>
        <button class="btn btn-dark px-4">선택상품 결제하기</button>
      </div>
    </div>
   </div>
  </div>
</div>
</body>
</html>
