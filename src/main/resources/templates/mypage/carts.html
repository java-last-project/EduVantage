<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script th:inline="javascript">
const SESSION_ID = /*[[${session.member_id}]]*/ 0
</script>
</head>
<body>
<div class="container-fluid p-3" id="carts">

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button type="button" class="nav-link fw-semibold" :class="store.activeTab==='course'?'active':'text-secondary'" @click="store.setTab('course')">
      	강의 장바구니 <span class="text-secondary">({{store.cCount}})</span>
      </button>
    </li>
    <li class="nav-item">
      <button type="button" class="nav-link fw-semibold" :class="store.activeTab==='book'?'active':'text-secondary'" @click="store.setTab('book')">
      	도서 장바구니 <span class="text-secondary">({{store.bCount}})</span>
      </button>
    </li>
  </ul>
 
  <div class="card border border-top-0 rounded-top-0" v-if="store.activeTab==='course'">
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center pb-3 border-bottom">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkAll" checked>
          <label class="form-check-label" for="checkAll">전체선택 (0/{{store.cCount}})</label>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm px-3">선택삭제</button>
          <button class="btn btn-outline-secondary btn-sm px-3">전체삭제</button>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3 py-3 border-bottom" v-for="(cvo,i) in store.cList" :key="index">
        <input class="form-check-input flex-shrink-0" type="checkbox" checked>
        <div class="bg-light rounded-2 flex-shrink-0" style="width: 150px; height: 100px;">
        	<img :src="cvo.thumbnail" style="width: 100%">
        </div>
        <div class="flex-grow-1">
          <div class="d-flex align-items-center gap-2">
            <span class="fw-bold">{{cvo.title}}</span>
          </div>
          <div class="text-secondary small mt-1">{{cvo.instructor}}</div>
        </div>
        <div class="text-end flex-shrink-0">
          <div class="text-secondary text-decoration-line-through" style="font-size: 13px">{{cvo.regular_price}}원</div>
          <div class="d-flex align-items-center gap-2">
            <span class="text-danger small">26% 할인</span>
            <span class="fw-bold">{{cvo.pay_price}}원</span>
          </div>
        </div>
        <button class="btn btn-sm text-secondary flex-shrink-0" aria-label="삭제">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
 
    <div class="card-footer bg-white d-flex justify-content-between align-items-center p-4">
      <span class="text-secondary">선택 상품 <span class="fw-bold text-dark">3개</span></span>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end">
          <div class="text-secondary" style="font-size: 12px">총 결제금액</div>
          <div class="fw-bold fs-5">원</div>
        </div>
        <button class="btn btn-dark px-4">선택상품 결제하기</button>
      </div>
    </div>
   </div>
  </div>
</div>
<script src="/vue/mypage/carts/cartsStore.js"></script>
<script>
  const {createApp,onMounted}=Vue
  const {createPinia}=Pinia

  const cartsApp=createApp({
    setup(){
      const store=useCartsStore()
      onMounted(()=>{
        store.courseCartListData(SESSION_ID)
      })
      return {
        store
      }
    }
  })
  cartsApp.use(createPinia())
  cartsApp.mount('#carts')
</script>
</body>
</html>
