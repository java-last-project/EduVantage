<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div class="container-fluid p-3">
  <div class="card border">
    <div class="card-body p-4">
 		
      <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div class="d-flex align-items-center gap-3">
          <div class="bg-light rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
               style="width: 88px; height: 88px;">
            <img th:src="${vo.profile_image}">
          </div>
          <div>
            <div class="fw-bold fs-5">[[${vo.name}]]</div>
            <div class="d-flex align-items-center flex-wrap gap-3 text-secondary mt-1" style="font-size: 13px;">
              <span th:if="${vo.email!=null}"><i class="bi bi-envelope me-1"></i>
              	[[${vo.email}]]
              </span>
              <span th:else><i class="bi bi-envelope me-1"></i>
              	이메일 없음
              </span>
              <span><i class="bi bi-calendar3 me-1"></i>[[${vo.dbRday}]] 가입</span>
            </div>
          </div>
        </div>
        <a href="#" class="btn btn-outline-secondary btn-sm px-3 flex-shrink-0">
          <i class="bi bi-pencil"></i> 프로필 수정
        </a>
      </div>
 
      <div class="border-top pt-4">
        <div class="text-secondary small mb-1">소개</div>
        <p class="mb-0" th:if="${vo.profile_desc!=null}">
          [[${vo.profile_desc}]]
        </p>
        <p class="mb-0" th:else>
          등록된 자기소개가 없습니다.
        </p>
      </div>
 
    </div>
  </div>
  <div class="row g-3 mt-3">
        <div class="col-4">
          <div class="border rounded-3 p-3 text-center">
            <div class="fw-bold fs-5 mt-1">1</div>
            <div class="text-secondary small">작성글</div>
          </div>
        </div>
        <div class="col-4">
          <div class="border rounded-3 p-3 text-center">
            <div class="fw-bold fs-5 mt-1">[[${eCount}]]</div>
            <div class="text-secondary small">수강중인 강좌</div>
          </div>
        </div>
        <div class="col-4">
          <div class="border rounded-3 p-3 text-center">
            <div class="fw-bold fs-5 mt-1">1</div>
            <div class="text-secondary small">작성한 강의평</div>
          </div>
        </div>
      </div>
</div>
</body>
</html>
