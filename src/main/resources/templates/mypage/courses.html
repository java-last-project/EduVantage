<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div class="container-fluid p-3">
  <div class="row g-4">
 
    <div class="col-md-4" th:each="vo:${cList}">
      <div class="card h-100 border-0 shadow-sm border-top border-4 border-primary">
        <div class="card-body pt-3">
    		<div class="rounded mb-3" style="height: 150px; overflow: hidden;">
  				<img th:src="${vo.thumbnail}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
			</div> 
          <h6 class="card-title text-truncate">[[${vo.title}]]</h6>
          <p class="text-secondary small mb-3">[[${vo.instructor}]]</p>
          <div class="d-flex justify-content-between small mb-1">
            <span class="text-secondary">학습 진행률</span>
            <span class="fw-bold text-primary">[[${vo.progress}]]%</span>
          </div>
          <div class="progress mb-3" style="height: 6px;">
            <div class="progress-bar" role="progressbar" th:style="'width: '+${vo.progress}+'%'"></div>
          </div>
          <a th:href="'/enrollment/'+${vo.course_no}" class="btn btn-primary w-100">이어서 학습하기</a>
        </div>
      </div>
    </div>

  </div>

  <div class="text-center py-5" th:if="${cList.isEmpty()}">
    <i class="bi bi-camera-reels" style="font-size: 48px; color: #ced4da;"></i>
    <p class="fw-bold mt-3 mb-1">수강 중인 강의가 없습니다</p>
    <p class="text-secondary small mb-4">관심있는 강의를 둘러보세요</p>
    <a href="/course/list" class="btn btn-dark px-4">강의 둘러보기</a>
  </div>
</div>
</body>
</html>
