# port => default : 8080
# Spring => 데이터베이스 (Datasource)
server:
  port: 9090
  servlet: 
    context-path: /

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${TEAMDB_URL}
    username: ${TEAMDB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
# web => upload

  jpa:
    database: oracle
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        user_sql_comments: true
#        => JPA / MyBatis / ThymeLeaf
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML	

mybatis:
  type-aliases-package: com.sist.web.domain
  mapper-locations: mybatis/mapper/*.xml
# logging
logging: 
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
# security
# spring ai
# websocket => kafka